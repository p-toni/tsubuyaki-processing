name: search-leverage-experiment

on:
  pull_request:
    paths:
      - "experiments/search-leverage-v1/**"
      - ".github/workflows/search-leverage-experiment.yml"

concurrency:
  group: search-leverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        route: [recurrence, orbit, family, sheet, filament]
        seed: [101, 103, 107]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run objective target-recovery block
        shell: bash
        run: |
          set -o pipefail
          python experiments/search-leverage-v1/reproduce.py \
            --route "${{ matrix.route }}" \
            --seed "${{ matrix.seed }}" \
            | tee "/tmp/search-leverage-${{ matrix.route }}-${{ matrix.seed }}.json"
      - name: Upload block result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-leverage-${{ matrix.route }}-${{ matrix.seed }}
          path: /tmp/search-leverage-${{ matrix.route }}-${{ matrix.seed }}.json
          if-no-files-found: warn

  aggregate:
    needs: block
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: search-leverage-*
          path: /tmp/search-leverage-results
          merge-multiple: true
      - name: Aggregate preregistered decision rules
        shell: bash
        run: |
          set -o pipefail
          python experiments/search-leverage-v1/aggregate.py \
            --results-dir /tmp/search-leverage-results \
            | tee /tmp/search-leverage-summary.json
      - name: Upload aggregate result
        uses: actions/upload-artifact@v4
        with:
          name: search-leverage-summary
          path: /tmp/search-leverage-summary.json
