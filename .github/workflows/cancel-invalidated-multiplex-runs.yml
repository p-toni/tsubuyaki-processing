name: cancel-invalidated-multiplex-runs

on:
  pull_request:
    paths:
      - '.github/workflows/cancel-invalidated-multiplex-runs.yml'

permissions:
  contents: read
  actions: write

jobs:
  cancel-invalidated:
    runs-on: macos-latest
    steps:
      - name: Cancel every superseded multiplex-capacity run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: research-yuruyurau-grammar-audit-v2
        shell: bash
        run: |
          set -euo pipefail
          payload=$(curl -sS -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/multiplex-capacity-v1.yml/runs?branch=${BRANCH}&per_page=100")
          run_ids=$(printf '%s' "${payload}" | python3 -c 'import json,os,sys; keep=os.environ["KEEP_SHA"]; data=json.load(sys.stdin); print("\n".join(str(r["id"]) for r in data["workflow_runs"] if r.get("head_sha") != keep and r["status"] != "completed"))')
          echo "preserving multiplex runs for current PR head ${KEEP_SHA}"
          while IFS= read -r run_id; do
            [[ -z "${run_id}" ]] && continue
            code=$(curl -sS -o /tmp/cancel-response -w '%{http_code}' -L -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs/${run_id}/cancel")
            if [[ "${code}" != "202" && "${code}" != "409" ]]; then
              echo "cancel failed for ${run_id}: HTTP ${code}"
              cat /tmp/cancel-response
              exit 1
            fi
            echo "run ${run_id}: cancel requested (HTTP ${code})"
          done <<< "${run_ids}"
