name: cancel-invalidated-multiplex-runs

on:
  pull_request:
    paths:
      - '.github/workflows/cancel-invalidated-multiplex-runs.yml'

permissions:
  contents: read
  actions: write

jobs:
  cancel-invalidated:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel every superseded multiplex-capacity run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP_RUN: '33271931282'
          BRANCH: research-yuruyurau-grammar-audit-v2
        shell: bash
        run: |
          set -euo pipefail
          payload=$(curl -sS -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/multiplex-capacity-v1.yml/runs?branch=${BRANCH}&per_page=100")
          mapfile -t run_ids < <(printf '%s' "${payload}" | jq -r --argjson keep "${KEEP_RUN}" '.workflow_runs[] | select(.id != $keep and .status != "completed") | .id')
          echo "preserving authoritative run ${KEEP_RUN}"
          for run_id in "${run_ids[@]}"; do
            code=$(curl -sS -o /tmp/cancel-response -w '%{http_code}' -L -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs/${run_id}/cancel")
            if [[ "${code}" != "202" && "${code}" != "409" ]]; then
              echo "cancel failed for ${run_id}: HTTP ${code}"
              cat /tmp/cancel-response
              exit 1
            fi
            echo "run ${run_id}: cancel requested (HTTP ${code})"
          done
