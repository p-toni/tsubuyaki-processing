name: cancel-invalidated-multiplex-runs

on:
  pull_request:
    paths:
      - '.github/workflows/cancel-invalidated-multiplex-runs.yml'

permissions:
  contents: read
  actions: write

jobs:
  cancel-invalidated:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded multiplex-capacity runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          invalidated=(
            33270066086
            33270178627
            33270335092
            33271277738
            33271294744
            33271894976
            33271909686
          )
          for run_id in "${invalidated[@]}"; do
            status=$(curl -sS -L \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs/${run_id}" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            if [[ "${status}" == "completed" ]]; then
              echo "run ${run_id}: already completed"
              continue
            fi
            code=$(curl -sS -o /tmp/cancel-response -w '%{http_code}' -L -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs/${run_id}/cancel")
            if [[ "${code}" != "202" && "${code}" != "409" ]]; then
              echo "cancel failed for ${run_id}: HTTP ${code}"
              cat /tmp/cancel-response
              exit 1
            fi
            echo "run ${run_id}: cancel requested (HTTP ${code})"
          done
