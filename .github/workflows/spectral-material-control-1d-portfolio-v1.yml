name: spectral-material-control-1d-portfolio-v1

on:
  pull_request:
    paths:
      - 'experiments/spectral-material-control-1d-portfolio-v1/**'
      - '.github/workflows/spectral-material-control-1d-portfolio-v1.yml'
      - 'research-results/spectral-material-control-1d-portfolio-v1/**'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: guard
        name: Persisted-result guard and frozen source lock
        shell: bash
        run: |
          if test -f research-results/spectral-material-control-1d-portfolio-v1/results.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research-results/spectral-material-control-1d-portfolio-v1/results.json').read_text())
          assert d['decision'] in {'SPECTRAL_MATERIAL_CONTROL_1D_PORTFOLIO_PROMISING','SPECTRAL_MATERIAL_CONTROL_1D_PORTFOLIO_NOT_PROMISING'}
          PY
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          test "$(git hash-object prototypes/autonomous-discovery/core.py)" = 3b70f2f4a4b80fb149cb83de5f59d1b3b8b4a40a
          test "$(git hash-object prototypes/autonomous-discovery/representations.py)" = 1838d8afd05a55ae4acf49ac37a9a670858af913
          test "$(git hash-object prototypes/autonomous-discovery/orbit_representation.py)" = ec2aea2f0e889cea25e442dae7b5849bf8549cd1
          test "$(git hash-object prototypes/autonomous-discovery/rng_streams.py)" = 58b2dcea6dc692c34b2ed176c42ec85af82e30c1
          test "$(git hash-object experiments/sampling-invariance-v1/field.py)" = 66f59d92ab39379d3a2016d18adbd271827997dd
          test "$(git hash-object experiments/spectral-material-control-v1/spectral_control.py)" = 4109cb064b31e9ab8be77148a88bfb46e86cd2c0
          test "$(git hash-object experiments/spectral-material-control-v1/fast_grayscale_metric.py)" = 5acf47a96807a0027cdf4d66e03ce158638d9389
          test "$(git hash-object experiments/spectral-material-control-1d-portfolio-v1/targets_portfolio.py)" = bd9fed45692df8ae77b63b524b169b4c86325443
          test "$(git hash-object experiments/spectral-material-control-1d-portfolio-v1/run_portfolio.py)" = d98beda250db694c35e6cc38a0f2b939250d9a71
          test "$(git hash-object experiments/spectral-material-control-1d-portfolio-v1/aggregate_portfolio.py)" = cc61e9f187118ff1502819e10be46da4e262be72
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research-results/spectral-material-control-1d-confirmation-v1/results.json').read_text())
          assert d['decision']=='SPECTRAL_MATERIAL_CONTROL_1D_CONFIRMED'
          assert d['gates']['allThreeRouteSeedLower95Positive'] is True
          assert d['gates']['spectralValidityRetained'] is True
          PY

  target-contract:
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt -r experiments/sampling-invariance-v1/requirements.txt
      - name: Verify fresh target contract
        working-directory: experiments/spectral-material-control-1d-portfolio-v1
        run: python targets_portfolio.py > target-contract.json
      - name: Fail closed on target drift
        working-directory: experiments/spectral-material-control-1d-portfolio-v1
        shell: python
        run: |
          import json
          from pathlib import Path
          d=json.loads(Path('target-contract.json').read_text())
          assert d['valid'] is True
          assert d['disjointFromAllPriorSamplingTargets'] is True
          assert not d['priorOverlap']
      - uses: actions/upload-artifact@v4
        with:
          name: spectral-control-1d-portfolio-target-contract
          path: experiments/spectral-material-control-1d-portfolio-v1/target-contract.json

  smoke:
    needs: [preflight, target-contract]
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt -r experiments/sampling-invariance-v1/requirements.txt
      - name: Run excluded portfolio smoke
        working-directory: experiments/spectral-material-control-1d-portfolio-v1
        run: python run_portfolio.py --seed 121999 --output smoke.json
      - name: Verify common prefix and equal total budgets
        working-directory: experiments/spectral-material-control-1d-portfolio-v1
        shell: python
        run: |
          import json
          from pathlib import Path
          d=json.loads(Path('smoke.json').read_text())
          assert all(d['hardInvariants'].values())
          s=d['settings']
          assert s['routes']==['recurrence','orbit','filament']
          assert s['totalChallengersPerArm']==12
          assert s['baselineNativePerStart']==6
          assert s['mixedNativePerStart']==3
          assert s['mixedSpectralPerStart']==3
          assert s['spectralAmplitude']==16.0
          assert len(d['cells'])==45

  consumed:
    needs: [preflight, target-contract, smoke]
    if: needs.preflight.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        seed: [122011,122021,122027,122029,122033,122039,122041,122051,122053,122069,122081,122099,122117,122131,122147,122149,122167,122173,122201,122203,122207,122209,122219,122231]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt -r experiments/sampling-invariance-v1/requirements.txt
      - name: Run consumed portfolio block
        working-directory: experiments/spectral-material-control-1d-portfolio-v1
        run: python run_portfolio.py --seed ${{ matrix.seed }} --output seed-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: spectral-control-1d-portfolio-seed-${{ matrix.seed }}
          path: experiments/spectral-material-control-1d-portfolio-v1/seed-${{ matrix.seed }}.json

  aggregate:
    needs: [preflight, consumed]
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: spectral-control-1d-portfolio-seed-*
          path: blocks
      - name: Reduce complete fixed-budget rectangle
        working-directory: experiments/spectral-material-control-1d-portfolio-v1
        run: python aggregate_portfolio.py --input-root ../../blocks --output portfolio-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: spectral-control-1d-portfolio-summary
          path: experiments/spectral-material-control-1d-portfolio-v1/portfolio-summary.json
