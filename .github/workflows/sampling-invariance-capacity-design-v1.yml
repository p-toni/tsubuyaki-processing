name: sampling-invariance-capacity-design-v1

on:
  pull_request:
    paths:
      - 'experiments/sampling-invariance-v1/**'
      - '.github/workflows/sampling-invariance-capacity-design-v1.yml'

permissions:
  contents: read

jobs:
  design-seed:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [93001, 93007, 93019, 93037]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt -r experiments/sampling-invariance-v1/requirements.txt
      - name: Run excluded independent-exposure capacity block
        working-directory: experiments/sampling-invariance-v1
        run: |
          mkdir -p out
          python run_capacity.py --population design --seed ${{ matrix.seed }} --output out/seed-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: sampling-invariance-capacity-design-${{ matrix.seed }}
          path: experiments/sampling-invariance-v1/out/seed-${{ matrix.seed }}.json
          if-no-files-found: error

  design-aggregate:
    needs: design-seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt -r experiments/sampling-invariance-v1/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: sampling-invariance-capacity-design-*
          path: experiments/sampling-invariance-v1/design-blocks
          merge-multiple: true
      - name: Reduce excluded design rectangle
        working-directory: experiments/sampling-invariance-v1
        run: |
          python run_aggregate_capacity.py \
            --population design \
            --results-dir design-blocks \
            --output design-summary.json
          python - <<'PY'
          import json
          result = json.load(open('design-summary.json'))
          assert result['decision'] == 'DESIGN_INFRA_VALID', result
          assert all(result['hardInvariants'].values()), result['hardInvariants']
          print('excluded capacity design infrastructure passed')
          print('field added recovery:', result['primary']['fieldPortfolioAddedRecovery'])
          print('field meaningful fraction:', result['primary']['fieldMeaningfulUniqueContributionFraction'])
          print('current-route contribution baseline:', result['primary']['currentRouteMedianMeanAddedRecovery'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sampling-invariance-capacity-design-summary
          path: experiments/sampling-invariance-v1/design-summary.json
          if-no-files-found: error
