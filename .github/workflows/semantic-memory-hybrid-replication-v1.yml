name: semantic-memory-hybrid-replication-v1

on:
  pull_request:
    paths:
      - 'experiments/semantic-memory-hybrid-replication-v1/**'
      - 'research-results/semantic-memory-hybrid-replication-v1/results.json'
      - '.github/workflows/semantic-memory-hybrid-replication-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify terminal authoritative result
        run: |
          set -euo pipefail
          test -f research-results/semantic-memory-hybrid-replication-v1/results.json
          test "$(git hash-object research-results/semantic-memory-hybrid-replication-v1/results.json)" = "b7d495e39cfcd407bae66f1d821a01491c9bc7a1"
          python - <<'PY'
          import json
          x=json.load(open('research-results/semantic-memory-hybrid-replication-v1/results.json'))
          assert x['decision'] == 'EMPIRICAL_MEMORY_REFINEMENT_NOT_REPLICATED', x
          assert x['semanticEvidenceConsumed'] is True, x
          PY
          echo 'semantic-memory-hybrid-replication-v1 is terminal; authoritative evidence is archived and scientific seed regeneration is disabled.'
