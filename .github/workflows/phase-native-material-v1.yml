name: phase-native-material-v1

on:
  pull_request:
    paths:
      - 'experiments/phase-native-material-v1/**'
      - '.github/workflows/phase-native-material-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE: 94138c60179e15a5e0d70bf7494bbcadf7ec6726

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce frozen sources and fresh population
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git hash-object experiments/phase-native-material-v1/README.md)" = "0669308a78b27b0e2c7c0f8a48fe7fd24bf2ae5f"
          test "$(git hash-object experiments/phase-native-material-v1/run.py)" = "dcf15f528cc12c8c11b2e361f9767354bce263c4"
          test "$(git hash-object experiments/complete-workflow-audit-v2/render_exact_post.mjs)" = "4a6a2c18259dd316911aefc92d928347f2a26826"
          test "$(git hash-object scripts/check-length.mjs)" = "319681179e53cbb761135313332cfc83ea5b3f48"
          if git grep -n -E '770003|770019|770037|770053|770071|770089|770107|770127|770149|770167|770181|770199|770999' "$BASE" -- . >/tmp/base-770.txt; then
            echo 'reserved phase-native population already appears in frozen base:' >&2
            cat /tmp/base-770.txt >&2
            exit 1
          fi
          python -m py_compile experiments/phase-native-material-v1/run.py
      - name: Install image dependency
        run: python -m pip install Pillow
      - name: Run excluded smoke
        run: python experiments/phase-native-material-v1/run.py --smoke --out smoke | tee smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: phase-native-material-v1-smoke
          path: |
            smoke/
            smoke.log

  authoritative:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck frozen implementation
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/phase-native-material-v1/README.md)" = "0669308a78b27b0e2c7c0f8a48fe7fd24bf2ae5f"
          test "$(git hash-object experiments/phase-native-material-v1/run.py)" = "dcf15f528cc12c8c11b2e361f9767354bce263c4"
          python -m py_compile experiments/phase-native-material-v1/run.py
      - name: Install image dependency
        run: python -m pip install Pillow
      - name: Generate authoritative blinded pairs
        run: python experiments/phase-native-material-v1/run.py --out authoritative | tee authoritative.log
      - uses: actions/upload-artifact@v4
        with:
          name: phase-native-material-v1-reviewer
          path: authoritative/reviewer/
      - uses: actions/upload-artifact@v4
        with:
          name: phase-native-material-v1-sealed-key
          path: authoritative/sealed-key/
      - uses: actions/upload-artifact@v4
        with:
          name: phase-native-material-v1-mechanical
          path: |
            authoritative/mechanical.json
            authoritative.log
