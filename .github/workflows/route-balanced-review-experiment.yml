name: route-balanced-review-experiment

on:
  pull_request:
    paths:
      - "experiments/route-balanced-review-v1/**"
      - "prototypes/autonomous-discovery/evidence_selector.py"
      - "prototypes/autonomous-discovery/review_evidence_queue.py"
      - "prototypes/autonomous-discovery/test_evidence_selector.py"
      - ".github/workflows/route-balanced-review-experiment.yml"

permissions:
  contents: read

jobs:
  calibrate:
    strategy:
      fail-fast: false
      matrix:
        seed: [7, 19, 43]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run frozen-seed scheduler calibration
        run: |
          python experiments/route-balanced-review-v1/run_seed.py \
            --seed ${{ matrix.seed }} \
            | tee /tmp/route-balanced-review-${{ matrix.seed }}.json
      - name: Upload seed result
        uses: actions/upload-artifact@v4
        with:
          name: route-balanced-review-seed-${{ matrix.seed }}
          path: /tmp/route-balanced-review-${{ matrix.seed }}.json
