name: five-route-scheduler-stress-experiment

on:
  pull_request:
    paths:
      - "prototypes/autonomous-discovery/**"
      - "experiments/five-route-scheduler-stress-v1/**"
      - ".github/workflows/five-route-scheduler-stress-experiment.yml"

permissions:
  contents: read

jobs:
  representative-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run representative five-route convergence
        shell: bash
        run: |
          set -o pipefail
          python experiments/five-route-scheduler-stress-v1/reproduce.py \
            --brief living-form \
            --seed 89 \
            | tee /tmp/five-route-stress-living-form-89.json
      - name: Upload scenario result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-route-stress-living-form-89
          path: /tmp/five-route-stress-living-form-89.json
          if-no-files-found: warn
