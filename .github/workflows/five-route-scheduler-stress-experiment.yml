name: five-route-scheduler-stress-experiment

on:
  pull_request:
    paths:
      - "prototypes/autonomous-discovery/**"
      - "experiments/five-route-scheduler-stress-v1/**"
      - ".github/workflows/five-route-scheduler-stress-experiment.yml"

permissions:
  contents: read

jobs:
  policy-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        brief: [living-form, open-asymmetry, layered-field]
        seed: [89, 97]
        policy: [pair, triad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run split five-route policy convergence
        shell: bash
        run: |
          set -o pipefail
          python experiments/five-route-scheduler-stress-v1/reproduce.py \
            --brief "${{ matrix.brief }}" \
            --seed "${{ matrix.seed }}" \
            --policy "${{ matrix.policy }}" \
            | tee "/tmp/five-route-stress-${{ matrix.brief }}-${{ matrix.seed }}-${{ matrix.policy }}.json"
      - name: Upload policy result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-route-stress-${{ matrix.brief }}-${{ matrix.seed }}-${{ matrix.policy }}
          path: /tmp/five-route-stress-${{ matrix.brief }}-${{ matrix.seed }}-${{ matrix.policy }}.json
          if-no-files-found: warn

  aggregate:
    needs: policy-convergence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: five-route-stress-*
          path: /tmp/five-route-results
          merge-multiple: true
      - name: Aggregate frozen stress gates
        shell: bash
        run: |
          set -o pipefail
          python experiments/five-route-scheduler-stress-v1/aggregate.py \
            --results-dir /tmp/five-route-results \
            | tee /tmp/five-route-stress-summary.json
      - name: Upload aggregate result
        uses: actions/upload-artifact@v4
        with:
          name: five-route-stress-summary
          path: /tmp/five-route-stress-summary.json
