name: five-route-scheduler-stress-experiment

on:
  pull_request:
    paths:
      - "prototypes/autonomous-discovery/**"
      - "experiments/five-route-scheduler-stress-v1/**"
      - ".github/workflows/five-route-scheduler-stress-experiment.yml"

permissions:
  contents: read

jobs:
  replay-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Profile first five-route evidence replays
        run: |
          python experiments/five-route-scheduler-stress-v1/profile_replays.py \
            | tee /tmp/five-route-replay-profile.jsonl
      - name: Upload replay profile
        uses: actions/upload-artifact@v4
        with:
          name: five-route-replay-profile
          path: /tmp/five-route-replay-profile.jsonl
