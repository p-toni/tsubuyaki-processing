name: delivery-dispersion-artistic-v1

on:
  pull_request:
    paths:
      - 'experiments/delivery-dispersion-artistic-v1/**'
      - '.github/workflows/delivery-dispersion-artistic-v1.yml'
      - 'experiments/delivery-dispersion-shortlist-v1/run_shortlist.py'
      - 'research-results/delivery-dispersion-shortlist-v1/results.json'
      - 'prototypes/autonomous-discovery/core.py'
      - 'prototypes/autonomous-discovery/search_engine.py'
      - 'prototypes/autonomous-discovery/material_control.py'
      - 'prototypes/autonomous-discovery/orbit_representation.py'
      - 'prototypes/autonomous-discovery/pairwise_selector.py'
      - 'prototypes/autonomous-discovery/rng_streams.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      result_persisted: ${{ steps.guard.outputs.result_persisted }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard authoritative human result
        id: guard
        run: |
          if test -f research-results/delivery-dispersion-artistic-v1/results.json; then
            echo 'result_persisted=true' >> "$GITHUB_OUTPUT"
            echo 'Authoritative human result already persisted; consumed review will not regenerate.'
          else
            echo 'result_persisted=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Freeze artistic-review source contract
        if: steps.guard.outputs.result_persisted != 'true'
        run: |
          set -euo pipefail
          test -f research-results/delivery-dispersion-shortlist-v1/results.json
          python - <<'PY'
          import json
          x=json.load(open('research-results/delivery-dispersion-shortlist-v1/results.json'))
          assert x['decision'] == 'DISPERSION_SHORTLIST_PROMISING'
          assert x['dispersionShortlistPassed'] is True
          assert x['meanSeedEffect'] == 0.006510595911022672
          assert x['oneSided95BootstrapLower'] == 0.0011871329689249832
          assert all(v > 0 for v in x['routeMeanEffects'].values())
          assert x['researchLineStatus'] == 'MECHANICALLY_CONFIRMED_ARTISTIC_REVIEW_AUTHORIZED'
          PY
          test "$(git hash-object research-results/delivery-dispersion-shortlist-v1/results.json)" = "276ea942d8b7bed71ad6659b43e3d8b497579ae3"
          test "$(git hash-object experiments/delivery-dispersion-artistic-v1/README.md)" = "4952a7e6ebcae93aa21405e0d657b1ece9c61a95"
          test "$(git hash-object experiments/delivery-dispersion-artistic-v1/generate_review.py)" = "629bed756dc71d07e908f00bd219190c1a4673d4"
          test "$(git hash-object experiments/delivery-dispersion-artistic-v1/reduce_review.py)" = "8778af008c1b51a378e1d897dd55a24a6a763fd6"
          test "$(git hash-object experiments/delivery-dispersion-shortlist-v1/run_shortlist.py)" = "b3a6a9ebefb2221944404a63f7fdcfc7a65f51d5"
          test "$(git hash-object prototypes/autonomous-discovery/core.py)" = "c06b5c2d6440663becb6761981ab4cc033fe052a"
          test "$(git hash-object prototypes/autonomous-discovery/search_engine.py)" = "24492a967fcccbe01be773bf723dd9df0f501249"
          test "$(git hash-object prototypes/autonomous-discovery/material_control.py)" = "33e0462ad27f841a4369da306ecb64a15d2e0c13"
          test "$(git hash-object prototypes/autonomous-discovery/orbit_representation.py)" = "ec2aea2f0e889cea25e442dae7b5849bf8549cd1"
          test "$(git hash-object prototypes/autonomous-discovery/pairwise_selector.py)" = "0f17d6174d471bfbd2953544cc6425468212a2fc"
          test "$(git hash-object prototypes/autonomous-discovery/rng_streams.py)" = "58b2dcea6dc692c34b2ed176c42ec85af82e30c1"
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.result_persisted != 'true'
        with:
          python-version: '3.12'
      - if: steps.guard.outputs.result_persisted != 'true'
        run: python -m py_compile experiments/delivery-dispersion-artistic-v1/*.py

  smoke:
    needs: preflight
    if: needs.preflight.outputs.result_persisted != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Generate excluded artistic smoke
        run: |
          python experiments/delivery-dispersion-artistic-v1/generate_review.py \
            --smoke --output-root smoke > smoke-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.load(open('smoke-summary.json'))
          assert x['smoke'] is True and x['blockCount'] == 3
          assert x['minimumValidGenerated'] == 12
          assert x['allMixedBudgetsExact']
          assert x['allMinimumValidGeneratedMet']
          assert x['allShortlistsThreeDistinct']
          assert x['allPortfoliosNonidentical']
          assert x['allDispersionMinimumsAtLeastQuantile']
          contract=json.load(open('smoke/review/review-contract.json'))
          key=json.load(open('smoke/key/key.json'))
          assert contract['smoke'] is True and contract['blockCount'] == 3
          assert contract['candidatesPerSide'] == 3
          assert key['smoke'] is True and len(key['blocks']) == 3
          assert sorted(p.name for p in Path('smoke/review').glob('S*.png')) == ['S01.png','S02.png','S03.png']
          assert Path('smoke/review/contact-sheet.png').is_file()
          assert all({b['A'],b['B']} == {'dispersion','quantile'} for b in key['blocks'])
          PY

  review-package:
    needs: smoke
    if: needs.preflight.outputs.result_persisted != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Generate frozen 12-block artistic review package
        run: |
          python experiments/delivery-dispersion-artistic-v1/generate_review.py \
            --output-root package > package-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.load(open('package-summary.json'))
          assert x['smoke'] is False and x['blockCount'] == 12
          assert x['minimumValidGenerated'] == 12
          assert x['allMixedBudgetsExact']
          assert x['allMinimumValidGeneratedMet']
          assert x['allShortlistsThreeDistinct']
          assert x['allPortfoliosNonidentical']
          assert x['allDispersionMinimumsAtLeastQuantile']
          contract=json.load(open('package/review/review-contract.json'))
          key=json.load(open('package/key/key.json'))
          assert contract['smoke'] is False and contract['blockCount'] == 12
          assert contract['allowedJudgments'] == ['A>B','B>A','equivalent','unreviewable']
          assert contract['candidatesPerSide'] == 3
          assert key['smoke'] is False and len(key['blocks']) == 12
          assert sorted({b['route'] for b in key['blocks']}) == ['filament','orbit','recurrence']
          assert sorted({int(b['seed']) for b in key['blocks']}) == [743003,743021,743043,743063]
          assert all({b['A'],b['B']} == {'dispersion','quantile'} for b in key['blocks'])
          assert all(b['validGeneratedCount'] >= 12 for b in key['blocks'])
          assert all(len(set(b['quantile']['displayPhenotypes'])) == 3 for b in key['blocks'])
          assert all(len(set(b['dispersion']['displayPhenotypes'])) == 3 for b in key['blocks'])
          assert all(b['quantile']['displayPhenotypes'] != b['dispersion']['displayPhenotypes'] for b in key['blocks'])
          assert all(b['minimumPairwiseDistanceLift'] >= -1e-15 for b in key['blocks'])
          assert sorted(p.name for p in Path('package/review').glob('R*.png')) == [f'R{i:02d}.png' for i in range(1,13)]
          assert Path('package/review/contact-sheet.png').is_file()
          PY
      - name: Upload reviewer-facing artistic artifact
        uses: actions/upload-artifact@v4
        with:
          name: delivery-dispersion-artistic-review
          path: package/review/
      - name: Upload sealed policy identity key separately
        uses: actions/upload-artifact@v4
        with:
          name: delivery-dispersion-artistic-key
          path: package/key/key.json
