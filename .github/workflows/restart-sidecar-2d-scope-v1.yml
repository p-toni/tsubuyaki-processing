name: restart-sidecar-2d-scope-v1

on:
  pull_request:
    paths:
      - 'experiments/restart-sidecar-2d-scope-v1/**'
      - '.github/workflows/restart-sidecar-2d-scope-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PRE_EXPERIMENT_BASE: 5aafb1a238c9f01fecbc7594d8cd631283a81dc1

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      consumed: ${{ steps.guard.outputs.consumed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard authoritative result
        id: guard
        run: |
          if test -f research-results/restart-sidecar-2d-scope-v1/results.json; then
            echo 'consumed=true' >> "$GITHUB_OUTPUT"
            echo 'authoritative result already archived; scientific regeneration remains closed'
          else
            echo 'consumed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Freeze protocol and fresh namespace
        if: steps.guard.outputs.consumed != 'true'
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/restart-sidecar-2d-scope-v1/README.md)" = "69250bc87179ebf105d21f1f3ddb8dc859f3a0fd"
          test "$(git hash-object experiments/restart-sidecar-2d-scope-v1/run.py)" = "6477190e45614217560845ec3150961f7763aab5"
          test "$(git hash-object experiments/restart-sidecar-2d-scope-v1/aggregate.py)" = "0c16c09153e24cc1593ee2da3c1c9b3b33929ab1"
          test "$(git merge-base "$PRE_EXPERIMENT_BASE" HEAD)" = "$PRE_EXPERIMENT_BASE"
          actual="$(git diff --name-only "$PRE_EXPERIMENT_BASE"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/restart-sidecar-2d-scope-v1.yml' \
            'experiments/restart-sidecar-2d-scope-v1/README.md' \
            'experiments/restart-sidecar-2d-scope-v1/aggregate.py' \
            'experiments/restart-sidecar-2d-scope-v1/run.py' | sort)"
          test "$actual" = "$expected"
          seeds='760999 760003 760019 760037 760053 760071 760089 760107 760127 760149 760167 760181 760199 760223 760239 760257 760277 760293 760311 760331 760349'
          for s in $seeds; do
            if git grep -n -E "(^|[^0-9])${s}([^0-9]|$)" "$PRE_EXPERIMENT_BASE" -- .; then
              echo "seed ${s} already existed at frozen pre-experiment base" >&2
              exit 1
            fi
            if git log "$PRE_EXPERIMENT_BASE" --format='%B' | grep -E "(^|[^0-9])${s}([^0-9]|$)"; then
              echo "seed ${s} found in pre-experiment commit messages" >&2
              exit 1
            fi
          done
          python -m py_compile experiments/restart-sidecar-2d-scope-v1/*.py

  smoke:
    needs: preflight
    if: needs.preflight.outputs.consumed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run excluded smoke
        run: |
          python experiments/restart-sidecar-2d-scope-v1/run.py \
            --seed 760999 --smoke --output smoke.json
          python - <<'PY'
          import json
          x=json.load(open('smoke.json'))
          assert x['smoke'] is True and x['masterSeed'] == 760999
          assert x['settings']['routes'] == ['family','sheet']
          assert x['settings']['sidecarAttemptsPerRoute'] == 8
          assert x['settings']['baselineNativePerRoute'] == 20
          assert x['settings']['baselineSpectralPerRoute'] == 0
          assert all(x['hardInvariants'].values())
          assert x['hardInvariants']['productionAuthorityUnchanged']
          assert len(x['cells']) == 30
          PY

  seed:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        seed: [760003,760019,760037,760053,760071,760089,760107,760127,760149,760167,760181,760199,760223,760239,760257,760277,760293,760311,760331,760349]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run frozen seed
        env:
          SEED: ${{ matrix.seed }}
        run: |
          python experiments/restart-sidecar-2d-scope-v1/run.py \
            --seed "$SEED" --output "seed-$SEED.json"
          python - <<'PY'
          import json, os
          seed=int(os.environ['SEED'])
          x=json.load(open(f'seed-{seed}.json'))
          assert x['masterSeed']==seed and x['smoke'] is False
          assert all(x['hardInvariants'].values())
          assert len(x['cells']) == 30
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: restart-sidecar-2d-scope-seed-${{ matrix.seed }}
          path: seed-${{ matrix.seed }}.json

  aggregate:
    needs: seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: restart-sidecar-2d-scope-seed-*
          path: seed-results
          merge-multiple: true
      - name: Reduce complete frozen rectangle
        run: |
          python experiments/restart-sidecar-2d-scope-v1/aggregate.py \
            --input-dir seed-results --output results.json
          python - <<'PY'
          import json
          x=json.load(open('results.json'))
          assert x['seedCount']==20
          assert x['routeSeedCount']==40
          assert x['sidecarAttemptsPerRoute']==8
          assert x['decision'] in {
            'SIDECAR_2D_SCOPE_MECHANICALLY_SUPPORTED',
            'SIDECAR_2D_SCOPE_NOT_SUPPORTED',
          }
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: restart-sidecar-2d-scope-v1-summary
          path: results.json
