name: dynamic-lazy-review-experiment

on:
  pull_request:
    paths:
      - "experiments/dynamic-lazy-review-v1/**"
      - "prototypes/autonomous-discovery/test_dynamic_lazy_review.py"
      - ".github/workflows/dynamic-lazy-review-experiment.yml"

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run full dynamic calibration
        run: |
          python experiments/dynamic-lazy-review-v1/reproduce.py --output /tmp/dynamic-lazy-review-results.json
      - name: Upload calibration result
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-lazy-review-results
          path: /tmp/dynamic-lazy-review-results.json
