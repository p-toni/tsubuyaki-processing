name: complete-workflow-audit-v2

on:
  pull_request:
    paths:
      - 'experiments/complete-workflow-audit-v2/**'
      - '.github/workflows/complete-workflow-audit-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE: b8cb5d26853f380f70746bdb9613512d47d55056

jobs:
  simple-arm-final-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce frozen prior reviews and arm ordering
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test -f experiments/complete-workflow-audit-v2/simple-arm-review-v1.json
          test -f experiments/complete-workflow-audit-v2/simple-arm-review-v2.json
          test -f experiments/complete-workflow-audit-v2/simple-arm-candidates-v3-final-revision.json
          python - <<'PY'
          import json
          a=json.load(open('experiments/complete-workflow-audit-v2/simple-arm-review-v1.json'))
          b=json.load(open('experiments/complete-workflow-audit-v2/simple-arm-review-v2.json'))
          assert a['sourceArtifact']['digest'] == 'sha256:c62da22c49d99a1c3c449e6245c2878112813909272e37fde23d8bb848b37e05'
          assert b['sourceArtifact']['workflowRun'] == 34007871043
          assert b['sourceArtifact']['artifactId'] == 9981531516
          assert b['sourceArtifact']['digest'] == 'sha256:4e617715b1d0f574147bdeac61ad5c8e95ddf1078e1e1d3fbead933fc594a729'
          assert b['researchArmGeneratedOrInspectedBeforeDecision'] is False
          assert [k for k,v in b['decisions'].items() if v['decision']=='revise'] == ['F05']
          PY
          if test -e experiments/complete-workflow-audit-v2/research-arm; then
            echo 'research arm cannot exist before simple arm freeze' >&2
            exit 1
          fi
          python -m py_compile experiments/complete-workflow-audit-v2/verify_simple_candidates.py
          node --check experiments/complete-workflow-audit-v2/render_exact_post.mjs
      - name: Install image dependency
        run: python -m pip install Pillow
      - name: Verify final F05 revision
        run: |
          python experiments/complete-workflow-audit-v2/verify_simple_candidates.py \
            --candidates experiments/complete-workflow-audit-v2/simple-arm-candidates-v3-final-revision.json \
            --out simple-arm-final-revision > simple-arm-final-revision.log
          cat simple-arm-final-revision/verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: complete-workflow-audit-v2-simple-final-revision
          path: |
            simple-arm-final-revision/
            simple-arm-final-revision.log
