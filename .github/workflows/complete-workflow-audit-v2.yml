name: complete-workflow-audit-v2

on:
  pull_request:
    paths:
      - 'experiments/complete-workflow-audit-v2/**'
      - '.github/workflows/complete-workflow-audit-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE: b8cb5d26853f380f70746bdb9613512d47d55056

jobs:
  research-arm-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce S freeze before R
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test -f experiments/complete-workflow-audit-v2/simple-arm-frozen.json
          test -f experiments/complete-workflow-audit-v2/research-arm/run_shortlists.py
          python - <<'PY'
          import json
          x=json.load(open('experiments/complete-workflow-audit-v2/simple-arm-frozen.json'))
          assert x['status']=='FROZEN_BEFORE_RESEARCH_ARM'
          assert x['authoritativeVerification']['workflowRun']==34008025839
          assert x['authoritativeVerification']['artifactId']==9981580636
          assert x['authoritativeVerification']['digest']=='sha256:bff1d33ce8241ebc6896cd22d1479bdb4e127cd97f4d68a746c93f80ed9f1f1e'
          assert x['researchArmGeneratedOrInspectedBeforeFreeze'] is False
          PY
          if git grep -n -E '768003|768019|768037|768053|768071|768089|768107|768127|768149|768167|768181|768199|768999' "$BASE" -- . >/tmp/base-768.txt; then
            echo 'reserved v2 R seed namespace already appears in frozen base:' >&2
            cat /tmp/base-768.txt >&2
            exit 1
          fi
          python -m py_compile experiments/complete-workflow-audit-v2/research-arm/run_shortlists.py
      - name: Install research dependencies
        run: python -m pip install numpy Pillow
      - name: Run excluded R smoke
        run: |
          python experiments/complete-workflow-audit-v2/research-arm/run_shortlists.py --smoke --out r-smoke | tee r-smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: complete-workflow-audit-v2-r-smoke
          path: |
            r-smoke/
            r-smoke.log

  research-arm-authoritative:
    needs: research-arm-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck S freeze and authoritative seed table
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x=json.load(open('experiments/complete-workflow-audit-v2/simple-arm-frozen.json'))
          assert x['authoritativeVerification']['digest']=='sha256:bff1d33ce8241ebc6896cd22d1479bdb4e127cd97f4d68a746c93f80ed9f1f1e'
          b=json.load(open('experiments/complete-workflow-audit-v2/briefs.json'))
          assert [z['id'] for z in b['briefs']]==[f'F{i:02d}' for i in range(1,13)]
          PY
          python -m py_compile experiments/complete-workflow-audit-v2/research-arm/run_shortlists.py
      - name: Install research dependencies
        run: python -m pip install numpy Pillow
      - name: Generate authoritative target-blind R shortlists
        run: |
          python experiments/complete-workflow-audit-v2/research-arm/run_shortlists.py --out r-authoritative | tee r-authoritative.log
      - uses: actions/upload-artifact@v4
        with:
          name: complete-workflow-audit-v2-r-authoritative
          path: |
            r-authoritative/
            r-authoritative.log
