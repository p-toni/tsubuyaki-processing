name: complete-workflow-audit-v2

on:
  pull_request:
    paths:
      - 'experiments/complete-workflow-audit-v2/**'
      - '.github/workflows/complete-workflow-audit-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE: b8cb5d26853f380f70746bdb9613512d47d55056

jobs:
  simple-arm-revisions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce frozen first-pass review and arm ordering
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test -f experiments/complete-workflow-audit-v2/README.md
          test -f experiments/complete-workflow-audit-v2/briefs.json
          test -f experiments/complete-workflow-audit-v2/simple-arm-candidates-v1.json
          test -f experiments/complete-workflow-audit-v2/simple-arm-readable-v1.md
          test -f experiments/complete-workflow-audit-v2/simple-arm-review-v1.json
          test -f experiments/complete-workflow-audit-v2/simple-arm-candidates-v2-revisions.json
          python - <<'PY'
          import json
          x=json.load(open('experiments/complete-workflow-audit-v2/simple-arm-review-v1.json'))
          assert x['sourceArtifact']['workflowRun'] == 34007753367
          assert x['sourceArtifact']['artifactId'] == 9981501955
          assert x['sourceArtifact']['digest'] == 'sha256:c62da22c49d99a1c3c449e6245c2878112813909272e37fde23d8bb848b37e05'
          assert x['researchArmGeneratedOrInspectedBeforeDecision'] is False
          assert sorted(k for k,v in x['decisions'].items() if v['decision']=='revise') == ['F05','F08','F10']
          PY
          if test -e experiments/complete-workflow-audit-v2/research-arm; then
            echo 'research arm cannot exist before simple arm freeze' >&2
            exit 1
          fi
          python -m py_compile experiments/complete-workflow-audit-v2/verify_simple_candidates.py
          node --check experiments/complete-workflow-audit-v2/render_exact_post.mjs
      - name: Install image dependency
        run: python -m pip install Pillow
      - name: Verify targeted second-pass revisions
        run: |
          python experiments/complete-workflow-audit-v2/verify_simple_candidates.py \
            --candidates experiments/complete-workflow-audit-v2/simple-arm-candidates-v2-revisions.json \
            --out simple-arm-revisions > simple-arm-revisions.log
          cat simple-arm-revisions/verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: complete-workflow-audit-v2-simple-revisions
          path: |
            simple-arm-revisions/
            simple-arm-revisions.log
