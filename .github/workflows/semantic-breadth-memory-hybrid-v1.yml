name: semantic-breadth-memory-hybrid-v1

on:
  pull_request:
    paths:
      - 'experiments/semantic-breadth-memory-hybrid-v1/**'
      - 'research-results/semantic-breadth-memory-hybrid-v1/results.json'
      - '.github/workflows/semantic-breadth-memory-hybrid-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify terminal authoritative result
        run: |
          set -euo pipefail
          test -f research-results/semantic-breadth-memory-hybrid-v1/results.json
          test "$(git hash-object research-results/semantic-breadth-memory-hybrid-v1/results.json)" = "c8a4e04a4b9210048fb236ad14f73f8d23006929"
          python - <<'PY'
          import json
          x=json.load(open('research-results/semantic-breadth-memory-hybrid-v1/results.json'))
          assert x['decision'] == 'HYBRID_REFINEMENT_NOT_PROMISING', x
          assert x['semanticEvidenceConsumed'] is True, x
          PY
          echo 'semantic-breadth-memory-hybrid-v1 is terminal; authoritative evidence is archived and scientific seed regeneration is disabled.'
