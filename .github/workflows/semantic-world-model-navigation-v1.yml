name: semantic-world-model-navigation-v1

on:
  pull_request:
    paths:
      - 'experiments/semantic-world-model-navigation-v1/**'
      - 'research-results/semantic-world-model-navigation-v1/results.json'
      - '.github/workflows/semantic-world-model-navigation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify terminal authoritative result
        run: |
          set -euo pipefail
          test -f research-results/semantic-world-model-navigation-v1/results.json
          test "$(git hash-object research-results/semantic-world-model-navigation-v1/results.json)" = "041e9e669031ad43925ef9cee4c88981be6ecc85"
          python - <<'PY'
          import json
          x=json.load(open('research-results/semantic-world-model-navigation-v1/results.json'))
          assert x['decision'] == 'WORLD_MODEL_NOT_CALIBRATED', x
          PY
          echo 'semantic-world-model-navigation-v1 is terminal; authoritative evidence is archived and scientific seed regeneration is disabled.'
