name: search-measurement-geometry

on:
  pull_request:
    paths:
      - "experiments/search-measurement-geometry-v1/**"
      - ".github/workflows/search-measurement-geometry.yml"

concurrency:
  group: search-measurement-geometry-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        route: [recurrence, orbit, family, sheet, filament]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run design and metric-holdout blocks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          for seed in 101 103 107 109 113 127; do
            python experiments/search-measurement-geometry-v1/audit.py \
              --route "${{ matrix.route }}" \
              --seed "$seed" \
              > "/tmp/out/${{ matrix.route }}-$seed.json"
            test -s "/tmp/out/${{ matrix.route }}-$seed.json"
            python -m json.tool "/tmp/out/${{ matrix.route }}-$seed.json" >/dev/null
          done
      - uses: actions/upload-artifact@v4
        with:
          name: search-measurement-geometry-${{ matrix.route }}
          path: /tmp/out/*.json

  aggregate:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: search-measurement-geometry-*
          path: /tmp/geometry
          merge-multiple: false
      - name: Reduce geometric metric holdout
        shell: bash
        run: |
          set -euo pipefail
          python experiments/search-measurement-geometry-v1/aggregate.py \
            --results-dir /tmp/geometry \
            > /tmp/search-measurement-geometry-summary.json
          test -s /tmp/search-measurement-geometry-summary.json
          python -m json.tool /tmp/search-measurement-geometry-summary.json >/dev/null
          cat /tmp/search-measurement-geometry-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: search-measurement-geometry-summary
          path: /tmp/search-measurement-geometry-summary.json
