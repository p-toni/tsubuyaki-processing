name: live-image-judge-v1

on:
  pull_request:
    paths:
      - "experiments/live-image-judge-v1/**"
      - ".github/workflows/live-image-judge-v1.yml"

permissions:
  contents: read

jobs:
  adaptive-round:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Rebuild frozen blinded route screen
        run: |
          python prototypes/autonomous-discovery/screened_run.py prepare \
            --brief prototypes/autonomous-discovery/brief.json \
            --seed 260828 \
            --out /tmp/live-image-judge \
            --probe-budget 10 \
            --minimum-per-route 2
      - name: Apply committed blinded route decisions
        run: |
          cp experiments/live-image-judge-v1/route-decisions.json \
            /tmp/live-image-judge/route-screen/decisions-template.json
      - name: Rebuild round-1 candidate queue
        run: |
          python prototypes/autonomous-discovery/screened_run.py resume \
            --out /tmp/live-image-judge \
            --total-start-budget 20 \
            --source-class independent-model \
            --source-id gpt-5.6-sol-conversation-review-2026-08-28 \
            --evidence-authoritative-promotion \
            --candidate-review-queue /tmp/live-image-judge/candidate-review \
            --candidate-max-pending-reviews 2
      - name: Apply and replay candidate decision rounds
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          root=Path('/tmp/live-image-judge')
          decisions=root/'candidate-review'/'decisions.json'
          for round_no in (1,2,3):
              src=Path(f'experiments/live-image-judge-v1/candidate-decisions-round{round_no}.json')
              current=json.loads(decisions.read_text())
              extra=json.loads(src.read_text())
              for pair_id,item in extra['decisions'].items():
                  if pair_id not in current['decisions']:
                      raise SystemExit(f'round-{round_no} pair missing from reconstructed queue: {pair_id}')
                  current['decisions'][pair_id]=item
              decisions.write_text(json.dumps(current,indent=2)+'\n')
              subprocess.run([
                  'python','prototypes/autonomous-discovery/screened_run.py','resume',
                  '--out',str(root),'--total-start-budget','20',
                  '--source-class','independent-model',
                  '--source-id','gpt-5.6-sol-conversation-review-2026-08-28',
                  '--evidence-authoritative-promotion',
                  '--candidate-review-queue',str(root/'candidate-review'),
                  '--candidate-max-pending-reviews','2',
              ],check=True)
          PY
      - name: Upload adaptive review state
        uses: actions/upload-artifact@v4
        with:
          name: live-image-judge-adaptive-round
          path: /tmp/live-image-judge
