name: family-spectral-projection-v1

on:
  pull_request:
    paths:
      - 'experiments/family-spectral-projection-v1/**'
      - '.github/workflows/family-spectral-projection-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PRE_EXPERIMENT_BASE: 7447b1a35894312d6e3c01ad9edf49aa8c7b87c1

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      consumed: ${{ steps.guard.outputs.consumed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard authoritative result
        id: guard
        run: |
          if test -f research-results/family-spectral-projection-v1/results.json; then
            echo 'consumed=true' >> "$GITHUB_OUTPUT"
            echo 'authoritative result already archived; regeneration remains closed'
          else
            echo 'consumed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Freeze protocol and fresh namespace
        if: steps.guard.outputs.consumed != 'true'
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/family-spectral-projection-v1/README.md)" = "bd57351e6774d00ab42f4c9f105f3aa92e77847b"
          test "$(git hash-object experiments/family-spectral-projection-v1/family_projection.py)" = "bea08209f8ae9cd1114e82a281b87655c7edc47b"
          test "$(git hash-object experiments/family-spectral-projection-v1/targets.py)" = "b3f6e6d944c89e413359a8bac9dfa12bc0101c15"
          test "$(git hash-object experiments/family-spectral-projection-v1/run.py)" = "e973c2f39f00e138200e47cad5d6c46b0b0cce22"
          test "$(git hash-object experiments/family-spectral-projection-v1/aggregate.py)" = "ef13ea394180fb0040d37a066f57d2546dec76de"
          test "$(git merge-base "$PRE_EXPERIMENT_BASE" HEAD)" = "$PRE_EXPERIMENT_BASE"
          actual="$(git diff --name-only "$PRE_EXPERIMENT_BASE"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/family-spectral-projection-v1.yml' \
            'experiments/family-spectral-projection-v1/README.md' \
            'experiments/family-spectral-projection-v1/aggregate.py' \
            'experiments/family-spectral-projection-v1/family_projection.py' \
            'experiments/family-spectral-projection-v1/run.py' \
            'experiments/family-spectral-projection-v1/targets.py' | sort)"
          test "$actual" = "$expected"
          seeds='762999 762003 762019 762037 762053 762071 762089 762107 762127 762149 762167 762181 762199 762223 762239 762257 762277 762293 762311 762331 762349'
          for s in $seeds; do
            if git grep -n -E "(^|[^0-9])${s}([^0-9]|$)" "$PRE_EXPERIMENT_BASE" -- .; then
              echo "seed ${s} already existed at frozen pre-experiment base" >&2
              exit 1
            fi
            if git log "$PRE_EXPERIMENT_BASE" --format='%B' | grep -E "(^|[^0-9])${s}([^0-9]|$)"; then
              echo "seed ${s} found in pre-experiment commit messages" >&2
              exit 1
            fi
          done
          python -m py_compile experiments/family-spectral-projection-v1/*.py

  smoke:
    needs: preflight
    if: needs.preflight.outputs.consumed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run excluded smoke
        run: |
          python experiments/family-spectral-projection-v1/run.py \
            --seed 762999 --smoke --output smoke.json
          python - <<'PY'
          import json
          x=json.load(open('smoke.json'))
          assert x['smoke'] is True and x['masterSeed'] == 762999
          assert x['settings']['route'] == 'family'
          assert x['settings']['spectralAmplitude'] == 16.0
          assert x['settings']['fieldBandwidth'] == 2
          assert x['settings']['challengersPerArm'] == 12
          assert all(x['hardInvariants'].values())
          assert x['hardInvariants']['freshTargetContractValid']
          assert x['hardInvariants']['projectionTerminalLengthsExact']
          assert len(x['cells']) == 15
          PY

  seed:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        seed: [762003,762019,762037,762053,762071,762089,762107,762127,762149,762167,762181,762199,762223,762239,762257,762277,762293,762311,762331,762349]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run frozen seed
        env:
          SEED: ${{ matrix.seed }}
        run: |
          python experiments/family-spectral-projection-v1/run.py \
            --seed "$SEED" --output "seed-$SEED.json"
          python - <<'PY'
          import json, os
          seed=int(os.environ['SEED'])
          x=json.load(open(f'seed-{seed}.json'))
          assert x['masterSeed'] == seed and x['smoke'] is False
          assert all(x['hardInvariants'].values())
          assert len(x['cells']) == 15
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: family-spectral-projection-seed-${{ matrix.seed }}
          path: seed-${{ matrix.seed }}.json

  aggregate:
    needs: seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: family-spectral-projection-seed-*
          path: seed-results
          merge-multiple: true
      - name: Reduce complete frozen rectangle
        run: |
          python experiments/family-spectral-projection-v1/aggregate.py \
            --input-dir seed-results --output results.json
          python - <<'PY'
          import json
          x=json.load(open('results.json'))
          assert x['seedCount'] == 20
          assert x['cellCount'] == 300
          assert x['decision'] in {
            'FAMILY_SPECTRAL_GENERIC_AND_PROJECTED_MECHANICALLY_SUPPORTED',
            'FAMILY_SPECTRAL_PROJECTION_MECHANICALLY_SUPPORTED',
            'FAMILY_SPECTRAL_GENERIC_MECHANICALLY_SUPPORTED',
            'FAMILY_SPECTRAL_NOT_SUPPORTED',
          }
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: family-spectral-projection-v1-summary
          path: results.json
