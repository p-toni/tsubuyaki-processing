name: semantic-local-dynamics-v1

on:
  pull_request:
    paths:
      - 'experiments/semantic-local-dynamics-v1/**'
      - '.github/workflows/semantic-local-dynamics-v1.yml'
      - 'research-results/semantic-world-model-navigation-v1/results.json'
      - 'experiments/semantic-world-model-navigation-v1/world_model.py'
      - 'experiments/semantic-world-model-navigation-v1/unseen_targets.py'
      - 'experiments/semantic-perceptual-steering-v1/perceptual_metric.py'
      - 'experiments/sampling-invariance-search-v1/spectral_operator.py'
      - 'prototypes/autonomous-discovery/**'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frozen source lock and prior-result guard
        run: |
          set -euo pipefail
          test ! -f research-results/semantic-local-dynamics-v1/results.json
          grep -q 'WORLD_MODEL_NOT_CALIBRATED' research-results/semantic-world-model-navigation-v1/results.json
          test "$(git hash-object research-results/semantic-world-model-navigation-v1/results.json)" = "041e9e669031ad43925ef9cee4c88981be6ecc85"
          test "$(git hash-object experiments/semantic-local-dynamics-v1/local_dynamics.py)" = "a598026cf191e742885a5a01bb5498aca99af842"
          test "$(git hash-object experiments/semantic-local-dynamics-v1/generate_pairs.py)" = "70073d40d4528221bedf4401374d7717c97e9345"
          test "$(git hash-object experiments/semantic-local-dynamics-v1/fit_model.py)" = "31b5c1eb01c18bf3cc8dd226f234e6881570d7a4"
          test "$(git hash-object experiments/semantic-local-dynamics-v1/calibrate_seed.py)" = "c111cf692f0f0e7260c50070dd83b58dd45bdccc"
          test "$(git hash-object experiments/semantic-local-dynamics-v1/aggregate_calibration.py)" = "2d4e4fc81351eb0daf162a83162a8e8fbcfcff4c"
          test "$(git hash-object experiments/semantic-local-dynamics-v1/run_navigation.py)" = "76d06a21fb4bc16c253fdf30ec8ce8dbb9527a9a"
          test "$(git hash-object experiments/semantic-local-dynamics-v1/aggregate.py)" = "53f92b6087d3e581ddf80523f05fa3d47e2de1d8"
          test "$(git hash-object experiments/semantic-world-model-navigation-v1/world_model.py)" = "1c5a19157b032284edc496834ffabd5205975596"
          test "$(git hash-object experiments/semantic-world-model-navigation-v1/unseen_targets.py)" = "bdf5e73cb95f8ee66a72b8f681d6a1f242a2d289"
          test "$(git hash-object experiments/semantic-perceptual-steering-v1/perceptual_metric.py)" = "46f707729cf4b9b0e027a220a17ec956a4c6c4ec"
          test "$(git hash-object experiments/sampling-invariance-search-v1/spectral_operator.py)" = "c86f3a5b9d2862afba4232956066faeda9f378f0"
          test "$(git hash-object prototypes/autonomous-discovery/core.py)" = "c06b5c2d6440663becb6761981ab4cc033fe052a"
          test "$(git hash-object prototypes/autonomous-discovery/material_control.py)" = "33e0462ad27f841a4369da306ecb64a15d2e0c13"
          test "$(git hash-object prototypes/autonomous-discovery/orbit_representation.py)" = "ec2aea2f0e889cea25e442dae7b5849bf8549cd1"
          test "$(git hash-object prototypes/autonomous-discovery/representations.py)" = "1838d8afd05a55ae4acf49ac37a9a670858af913"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile experiments/semantic-local-dynamics-v1/*.py

  targets:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Validate never-consumed frozen semantic suite
        run: |
          python experiments/semantic-world-model-navigation-v1/unseen_targets.py > target-contract.json
          python - <<'PY'
          import json
          x=json.load(open('target-contract.json'))
          assert x['valid'], x['failures']
          assert x['distinctFingerprints'] and x['disjointFromPriorTargets']
          assert len(x['prompts']) == 8
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: local-dynamics-target-contract
          path: target-contract.json

  train-data:
    needs: preflight
    strategy:
      fail-fast: true
      max-parallel: 6
      matrix:
        seed: [734100011, 734100029, 734100041, 734100067, 734100079, 734100101, 734100113, 734100137, 734100151, 734100173, 734100197, 734100211]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Generate target-blind local transition shard
        run: |
          python experiments/semantic-local-dynamics-v1/generate_pairs.py \
            --seed ${{ matrix.seed }} --bases-per-route 24 --output train-${{ matrix.seed }}.npz
          python - <<'PY'
          import glob, numpy as np
          p=glob.glob('train-*.npz')[0]
          with np.load(p, allow_pickle=False) as d:
              assert int(d['row_count'][0]) == 1152
              assert d['X'].shape[0] == 1152 and d['Y_delta'].shape[0] == 1152
              assert d['parent_valid'].min() == 1
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: local-dynamics-train-${{ matrix.seed }}
          path: train-${{ matrix.seed }}.npz

  fit-model:
    needs: train-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: local-dynamics-train-*
          path: training
          merge-multiple: true
      - name: Fit frozen target-agnostic local dynamics model
        run: |
          python experiments/semantic-local-dynamics-v1/fit_model.py \
            --input-dir training --model-output model.npz --summary-output training-summary.json
          python - <<'PY'
          import json
          x=json.load(open('training-summary.json'))
          assert x['rowCount'] == 13824, x
          assert x['shardCount'] == 12, x
          assert not x['trainingContainsSemanticTargets']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-local-dynamics-model-v1
          path: |
            model.npz
            training-summary.json

  calibrate-seed:
    needs: fit-model
    strategy:
      fail-fast: true
      max-parallel: 4
      matrix:
        seed: [734200011, 734200029, 734200041, 734200067]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: semantic-local-dynamics-model-v1
          path: model
      - name: Run target-free held-out local dynamics calibration shard
        run: |
          python experiments/semantic-local-dynamics-v1/calibrate_seed.py \
            --seed ${{ matrix.seed }} --model model/model.npz --output calibration-${{ matrix.seed }}.json
          python - <<'PY'
          import glob,json
          x=json.load(open(glob.glob('calibration-*.json')[0]))
          assert not x['calibrationContainsSemanticTargets']
          assert x['pairStats']['rowCount'] == 384
          assert len(x['retrievalTasks']) == 96
          assert all(x['hardInvariants'].values()), x['hardInvariants']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: local-dynamics-calibration-${{ matrix.seed }}
          path: calibration-${{ matrix.seed }}.json

  calibration-gate:
    needs: calibrate-seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: local-dynamics-calibration-*
          path: calibration
          merge-multiple: true
      - name: Reduce target-free calibration only
        run: |
          python experiments/semantic-local-dynamics-v1/aggregate_calibration.py \
            --input-dir calibration --output calibration-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-local-dynamics-calibration-summary
          path: calibration-summary.json
      - name: Enforce frozen target-free calibration gate
        run: |
          python - <<'PY'
          import json
          x=json.load(open('calibration-summary.json'))
          assert x['decision'] == 'LOCAL_DYNAMICS_CALIBRATED', x
          assert all(x['gates'].values()), x['gates']
          PY

  smoke:
    needs: [calibration-gate, targets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: semantic-local-dynamics-model-v1
          path: model
      - name: Run excluded exact-budget MPC smoke
        run: |
          python experiments/semantic-local-dynamics-v1/run_navigation.py \
            --seed 734399999 --model model/model.npz --output smoke.json --smoke
          python - <<'PY'
          import json
          x=json.load(open('smoke.json'))
          assert all(x['hardInvariants'].values()), x['hardInvariants']
          assert x['renderBudgetPerArmConcept'] == 60
          assert len(x['concepts']) == 8
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-local-dynamics-smoke
          path: smoke.json

  consumed:
    needs: smoke
    strategy:
      fail-fast: true
      max-parallel: 6
      matrix:
        seed: [734300011, 734300029, 734300041, 734300067, 734300079, 734300101, 734300113, 734300137, 734300151, 734300173, 734300197, 734300211]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: semantic-local-dynamics-model-v1
          path: model
      - name: Run fresh zero-shot local dynamics semantic seed
        run: |
          python experiments/semantic-local-dynamics-v1/run_navigation.py \
            --seed ${{ matrix.seed }} --model model/model.npz --output semantic-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-local-dynamics-${{ matrix.seed }}
          path: semantic-${{ matrix.seed }}.json

  aggregate:
    needs: consumed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: semantic-local-dynamics-7343*
          path: evidence
          merge-multiple: true
      - name: Reduce only complete fresh semantic rectangle
        run: |
          python experiments/semantic-local-dynamics-v1/aggregate.py \
            --input-dir evidence --output semantic-local-dynamics-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-local-dynamics-navigation-summary
          path: semantic-local-dynamics-summary.json
