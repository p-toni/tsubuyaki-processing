name: semantic-local-dynamics-v1

on:
  pull_request:
    paths:
      - 'experiments/semantic-local-dynamics-v1/**'
      - 'research-results/semantic-local-dynamics-v1/results.json'
      - '.github/workflows/semantic-local-dynamics-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify terminal authoritative result
        run: |
          set -euo pipefail
          test -f research-results/semantic-local-dynamics-v1/results.json
          test "$(git hash-object research-results/semantic-local-dynamics-v1/results.json)" = "8ded695acb6f8ca09a3eaee71744f21619db3440"
          python - <<'PY'
          import json
          x=json.load(open('research-results/semantic-local-dynamics-v1/results.json'))
          assert x['decision'] == 'LOCAL_DYNAMICS_NOT_CALIBRATED', x
          PY
          echo 'semantic-local-dynamics-v1 is terminal; authoritative evidence is archived and scientific seed regeneration is disabled.'
