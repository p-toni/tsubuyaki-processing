name: semantic-shape-steering-v1

on:
  pull_request:
    paths:
      - 'prototypes/autonomous-discovery/core.py'
      - 'prototypes/autonomous-discovery/search_engine.py'
      - 'prototypes/autonomous-discovery/material_control.py'
      - 'experiments/semantic-shape-steering-v1/**'
      - 'research-results/semantic-shape-steering-v1/**'
      - '.github/workflows/semantic-shape-steering-v1.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: guard
        name: Persisted-result guard and frozen source lock
        shell: bash
        run: |
          if test -f research-results/semantic-shape-steering-v1/results.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research-results/semantic-shape-steering-v1/results.json').read_text())
          assert d['decision'] in {'SEMANTIC_SHAPE_STEERING_MECHANICALLY_PROMISING','SEMANTIC_SHAPE_STEERING_NOT_READY'}
          PY
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          test "$(git hash-object prototypes/autonomous-discovery/core.py)" = c06b5c2d6440663becb6761981ab4cc033fe052a
          test "$(git hash-object prototypes/autonomous-discovery/search_engine.py)" = 24492a967fcccbe01be773bf723dd9df0f501249
          test "$(git hash-object prototypes/autonomous-discovery/material_control.py)" = 33e0462ad27f841a4369da306ecb64a15d2e0c13
          test "$(git hash-object experiments/semantic-shape-steering-v1/semantic_targets.py)" = ca1a9301ad65a74b6219aaeee02f7dad10ad79c0
          test "$(git hash-object experiments/semantic-shape-steering-v1/steering.py)" = b5a9e456b578f0ac286575b96869616e98d6733c
          test "$(git hash-object experiments/semantic-shape-steering-v1/run_block.py)" = a2a70b7dcd890ad8f58a3a7ea450a76240101a64
          test "$(git hash-object experiments/semantic-shape-steering-v1/aggregate.py)" = a9142eef8abd5639ade8b525978174cf9d048757
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research-results/spectral-material-control-runtime-replay-v1/results.json').read_text())
          assert d['decision']=='SPECTRAL_MATERIAL_CONTROL_RUNTIME_PROMISING'
          PY

  target-contract:
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Verify frozen semantic target contract
        working-directory: experiments/semantic-shape-steering-v1
        run: python semantic_targets.py > target-contract.json
      - name: Fail closed on target drift
        working-directory: experiments/semantic-shape-steering-v1
        shell: bash
        run: |
          cat target-contract.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('target-contract.json').read_text())
          assert d['valid'] is True
          assert d['disjointFromPriorTargets'] is True
          assert d['distinctFingerprints'] is True
          assert len(d['prompts']) == 8
          assert len(d['targets']) == 8
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-steering-target-contract
          path: experiments/semantic-shape-steering-v1/target-contract.json

  smoke:
    needs: [preflight, target-contract]
    if: needs.preflight.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        prompt: [heart, star, crescent, fish, butterfly, tree, letter-a, flower]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run excluded deterministic steering smoke
        working-directory: experiments/semantic-shape-steering-v1
        run: python run_block.py --seed 124999 --prompt '${{ matrix.prompt }}' --smoke --output 'smoke-${{ matrix.prompt }}.json'
      - name: Verify smoke invariants
        working-directory: experiments/semantic-shape-steering-v1
        shell: python
        run: |
          import json
          from pathlib import Path
          d=json.loads(Path('smoke-${{ matrix.prompt }}.json').read_text())
          assert d['smoke'] is True
          assert all(d['hardInvariants'].values()), d['hardInvariants']
          for route,x in d['routes'].items():
              for arm in ('blind','guided'):
                  c=x[arm]['operatorContract']
                  assert c['totalChallengers']==20
                  assert c['nativeChallengers']==10
                  assert c['spectralChallengers']==10
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-steering-smoke-${{ matrix.prompt }}
          path: experiments/semantic-shape-steering-v1/smoke-${{ matrix.prompt }}.json

  consumed:
    needs: [preflight, target-contract, smoke]
    if: needs.preflight.outputs.skip != 'true'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        seed: [125003,125011,125017,125029,125047,125053,125063,125087,125101,125113]
        prompt: [heart, star, crescent, fish, butterfly, tree, letter-a, flower]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run fresh paired steering block
        working-directory: experiments/semantic-shape-steering-v1
        run: python run_block.py --seed '${{ matrix.seed }}' --prompt '${{ matrix.prompt }}' --output 'seed-${{ matrix.seed }}-${{ matrix.prompt }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-steering-seed-${{ matrix.seed }}-${{ matrix.prompt }}
          path: experiments/semantic-shape-steering-v1/seed-${{ matrix.seed }}-${{ matrix.prompt }}.json

  aggregate:
    needs: [preflight, consumed]
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: semantic-steering-seed-*
          path: blocks
      - name: Reduce only after complete 80-block rectangle
        working-directory: experiments/semantic-shape-steering-v1
        run: python aggregate.py --input-root ../../blocks --output semantic-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-steering-summary
          path: experiments/semantic-shape-steering-v1/semantic-summary.json
