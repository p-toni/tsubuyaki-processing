name: online-topology-probe-calibration

on:
  pull_request:
    paths:
      - "experiments/online-topology-probe-v1/**"
      - ".github/workflows/online-topology-probe-calibration.yml"

concurrency:
  group: online-topology-probe-calibration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        route: [recurrence, orbit, family, sheet, filament]
        seed: [101, 103, 107, 109, 113, 127]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run probe pilot-size calibration block
        shell: bash
        run: |
          set -o pipefail
          python experiments/online-topology-probe-v1/probe.py \
            --route "${{ matrix.route }}" \
            --seed "${{ matrix.seed }}" \
            --pilot-sizes "1,2,3,4" \
            | tee "/tmp/online-probe-${{ matrix.route }}-${{ matrix.seed }}.json"
      - name: Upload calibration block
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-probe-${{ matrix.route }}-${{ matrix.seed }}
          path: /tmp/online-probe-${{ matrix.route }}-${{ matrix.seed }}.json
          if-no-files-found: warn

  aggregate-calibration:
    needs: block
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: online-probe-*
          path: /tmp/online-probe-results
          merge-multiple: true
      - name: Apply frozen pilot-size calibration rule
        shell: bash
        run: |
          set -o pipefail
          python experiments/online-topology-probe-v1/aggregate_calibration.py \
            --results-dir /tmp/online-probe-results \
            | tee /tmp/online-probe-calibration-summary.json
      - name: Upload calibration summary
        uses: actions/upload-artifact@v4
        with:
          name: online-probe-calibration-summary
          path: /tmp/online-probe-calibration-summary.json
