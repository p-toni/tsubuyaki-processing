name: compact-symplectic-material-v1

on:
  pull_request:
    paths:
      - 'experiments/compact-symplectic-material-v1/**'
      - '.github/workflows/compact-symplectic-material-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE: caddc6d36ebb064ffe45f4c866641b9dbf9c5226

jobs:
  post-generation-custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enforce consumed authoritative population
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git hash-object experiments/compact-symplectic-material-v1/README.md)" = "bd79835244895753cc52355a0cf1efcde28aea92"
          test "$(git hash-object experiments/compact-symplectic-material-v1/run.py)" = "d8bacac89d343e466e87ec7cb246a5264061553f"
          if grep -nE 'Run excluded smoke|Generate authoritative blinded pairs|run.py --smoke|run.py --out authoritative' .github/workflows/compact-symplectic-material-v1.yml; then
            echo 'consumed 769xxx generation path reappeared' >&2
            exit 1
          fi
          echo 'authoritative 769xxx generation is custody-closed'
