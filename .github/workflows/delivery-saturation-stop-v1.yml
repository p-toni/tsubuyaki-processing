name: delivery-saturation-stop-v1

on:
  pull_request:
    paths:
      - 'experiments/delivery-saturation-stop-v1/**'
      - '.github/workflows/delivery-saturation-stop-v1.yml'
      - 'research-results/delivery-dispersion-shortlist-v1/results.json'
      - 'research-results/delivery-dispersion-artistic-v1/results.json'
      - 'experiments/delivery-dispersion-shortlist-v1/run_shortlist.py'
      - 'prototypes/autonomous-discovery/core.py'
      - 'prototypes/autonomous-discovery/search_engine.py'
      - 'prototypes/autonomous-discovery/material_control.py'
      - 'prototypes/autonomous-discovery/orbit_representation.py'
      - 'prototypes/autonomous-discovery/pairwise_selector.py'
      - 'prototypes/autonomous-discovery/rng_streams.py'
      - 'experiments/spectral-material-control-v1/fast_grayscale_metric.py'
      - 'experiments/spectral-material-control-runtime-replay-v1/targets_runtime.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      result_persisted: ${{ steps.guard.outputs.result_persisted }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard authoritative result
        id: guard
        run: |
          if test -f research-results/delivery-saturation-stop-v1/results.json; then
            echo 'result_persisted=true' >> "$GITHUB_OUTPUT"
            echo 'Authoritative saturation result already persisted; consumed experiment will not rerun.'
          else
            echo 'result_persisted=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Freeze saturation source and prerequisite contract
        if: steps.guard.outputs.result_persisted != 'true'
        run: |
          set -euo pipefail
          test -f research-results/delivery-dispersion-shortlist-v1/results.json
          test -f research-results/delivery-dispersion-artistic-v1/results.json
          python - <<'PY'
          import json
          mechanical=json.load(open('research-results/delivery-dispersion-shortlist-v1/results.json'))
          artistic=json.load(open('research-results/delivery-dispersion-artistic-v1/results.json'))
          assert mechanical['decision'] == 'DISPERSION_SHORTLIST_PROMISING'
          assert mechanical['dispersionShortlistPassed'] is True
          assert mechanical['meanSeedEffect'] == 0.006510595911022672
          assert mechanical['oneSided95BootstrapLower'] == 0.0011871329689249832
          assert artistic['decision'] == 'ARTISTIC_SUPPORT'
          assert artistic['artisticSupportPassed'] is True
          assert artistic['totalDispersionVsQuantileNetPreference'] == 6
          assert artistic['promotion']['defaultThreeItemDeliveryShortlist'] == 'max-dispersion'
          assert artistic['promotion']['searchPolicyChanged'] is False
          assert artistic['researchLineStatus'] == 'DELIVERY_SHORTLIST_PROMOTED'
          PY
          test "$(git hash-object research-results/delivery-dispersion-shortlist-v1/results.json)" = "276ea942d8b7bed71ad6659b43e3d8b497579ae3"
          test "$(git hash-object research-results/delivery-dispersion-artistic-v1/results.json)" = "530c025ccfc735787032960726e6c131ba7bef64"
          test "$(git hash-object experiments/delivery-saturation-stop-v1/README.md)" = "8fa08bcfe2706ddd2ec282090ee0c5a90659426c"
          test "$(git hash-object experiments/delivery-saturation-stop-v1/run_stop.py)" = "bebbbee4a6e99207935910f0a5563676dc145406"
          test "$(git hash-object experiments/delivery-saturation-stop-v1/aggregate.py)" = "1f4caa998e741b94ba0fd357f5c33c5c8fc62c53"
          test "$(git hash-object experiments/delivery-dispersion-shortlist-v1/run_shortlist.py)" = "b3a6a9ebefb2221944404a63f7fdcfc7a65f51d5"
          test "$(git hash-object prototypes/autonomous-discovery/core.py)" = "c06b5c2d6440663becb6761981ab4cc033fe052a"
          test "$(git hash-object prototypes/autonomous-discovery/search_engine.py)" = "24492a967fcccbe01be773bf723dd9df0f501249"
          test "$(git hash-object prototypes/autonomous-discovery/material_control.py)" = "33e0462ad27f841a4369da306ecb64a15d2e0c13"
          test "$(git hash-object prototypes/autonomous-discovery/orbit_representation.py)" = "ec2aea2f0e889cea25e442dae7b5849bf8549cd1"
          test "$(git hash-object prototypes/autonomous-discovery/pairwise_selector.py)" = "0f17d6174d471bfbd2953544cc6425468212a2fc"
          test "$(git hash-object prototypes/autonomous-discovery/rng_streams.py)" = "58b2dcea6dc692c34b2ed176c42ec85af82e30c1"
          test "$(git hash-object experiments/spectral-material-control-v1/fast_grayscale_metric.py)" = "5acf47a96807a0027cdf4d66e03ce158638d9389"
          test "$(git hash-object experiments/spectral-material-control-runtime-replay-v1/targets_runtime.py)" = "d70da5ca546d4bbf402b6b2e8b15920d01ba6b47"
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.result_persisted != 'true'
        with:
          python-version: '3.12'
      - if: steps.guard.outputs.result_persisted != 'true'
        run: python -m py_compile experiments/delivery-saturation-stop-v1/*.py

  smoke:
    needs: preflight
    if: needs.preflight.outputs.result_persisted != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run excluded saturation smoke
        run: |
          python experiments/delivery-saturation-stop-v1/run_stop.py \
            --seed 744999 --smoke --output smoke.json
          python - <<'PY'
          import json
          x=json.load(open('smoke.json'))
          assert x['smoke'] is True and x['masterSeed'] == 744999
          assert x['artisticEvidence'] is False
          assert len(x['cells']) == 45
          assert all(x['hardInvariants'].values())
          assert x['settings']['minimumValidForSignal'] == 12
          assert x['settings']['stableAdditionsRequired'] == 3
          assert x['settings']['noninferiorityMargin'] == 0.003255297955511336
          for r in ('recurrence','orbit','filament'):
            rec=x['routes'][r]
            assert rec['operatorDiagnostics']['total'] == 20
            assert rec['operatorDiagnostics']['native'] == 10
            assert rec['operatorDiagnostics']['spectral'] == 10
            assert 12 <= rec['stopAttempt'] <= 20
            assert rec['attemptsSaved'] == 20 - rec['stopAttempt']
            assert rec['stoppedValidCount'] >= 12
            assert len(set(rec['stoppedTrio']['phenotypeHashes'])) == 3
            assert len(set(rec['fullTrio']['phenotypeHashes'])) == 3
          PY

  authoritative:
    needs: smoke
    if: needs.preflight.outputs.result_persisted != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run frozen 20-seed saturation counterfactual
        run: |
          set -euo pipefail
          mkdir -p seed-results
          for seed in \
            744003 744019 744037 744053 744071 \
            744089 744107 744127 744149 744167 \
            744181 744199 744223 744239 744257 \
            744277 744293 744311 744331 744349
          do
            python experiments/delivery-saturation-stop-v1/run_stop.py \
              --seed "$seed" --output "seed-results/seed-$seed.json"
          done
          python experiments/delivery-saturation-stop-v1/aggregate.py \
            --input-dir seed-results --output aggregate.json
          python - <<'PY'
          import json
          x=json.load(open('aggregate.json'))
          assert x['seedCount'] == 20
          assert x['routeSeedCount'] == 60
          assert x['cellCount'] == 900
          assert x['artisticEvidence'] is False
          assert x['noninferiorityMargin'] == 0.003255297955511336
          assert set(x['gates']) == {
            'earlyStopRateAtLeastHalf',
            'medianAttemptsSavedAtLeast3',
            'meanDeliveryLossBelowMargin',
            'delivery95UpperBelowMargin',
            'meanArchiveLossBelowMargin',
            'archive95UpperBelowMargin',
            'everyRouteMeanDeliveryLossBelowMargin',
            'everyRouteMeanArchiveLossBelowMargin',
          }
          PY
      - name: Upload authoritative saturation result
        uses: actions/upload-artifact@v4
        with:
          name: delivery-saturation-stop-v1-result
          path: |
            aggregate.json
            seed-results/
