name: sampling-invariance-search-v2

on:
  pull_request:
    paths:
      - 'experiments/sampling-invariance-search-v2/**'
      - '.github/workflows/sampling-invariance-search-v2.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      run_science: ${{ steps.guard.outputs.run_science }}
    steps:
      - uses: actions/checkout@v4
      - id: guard
        shell: bash
        run: |
          if [[ -f research-results/sampling-invariance-search-v2/results.json ]]; then
            echo 'run_science=false' >> "$GITHUB_OUTPUT"
            echo 'Persisted v2 result exists; skip expensive rerun.'
          else
            echo 'run_science=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify prerequisite evidence and frozen scientific blobs
        shell: bash
        run: |
          test "$(git hash-object experiments/sampling-invariance-v1/field.py)" = 66f59d92ab39379d3a2016d18adbd271827997dd
          test "$(git hash-object experiments/sampling-invariance-v1/capacity.py)" = fa5aa481ddab9babff17abdf1e4342d7ed74d2a2
          test "$(git hash-object experiments/sampling-invariance-v1/fast_binary_metric.py)" = 7e1c875350050312971d9397091e8708752c0bcd
          test "$(git hash-object experiments/sampling-invariance-search-v1/spectral_operator.py)" = c86f3a5b9d2862afba4232956066faeda9f378f0
          test "$(git hash-object experiments/sampling-invariance-search-v2/targets_v2.py)" = b130319589cf4c783232a4a0d66dcbc089de72ca
          test "$(git hash-object experiments/sampling-invariance-search-v2/run_search_v2.py)" = 1e2f0dc4c03971287fe87da184e3c01674f84284
          test "$(git hash-object experiments/sampling-invariance-search-v2/run_v2.py)" = 697a3ee18ce1cf8634789941b1ea8adcb6e2eac8
          test "$(git hash-object experiments/sampling-invariance-search-v2/aggregate_v2.py)" = 5c1b000694e122e128a472bc6e0346e17c44e514
          python - <<'PY'
          import json
          capacity = json.load(open('research-results/sampling-invariance-capacity-confirmation-v1/results.json'))
          calibration = json.load(open('research-results/sampling-invariance-search-calibration-v1/results.json'))
          v1 = json.load(open('research-results/sampling-invariance-search-v1/results.json'))
          assert capacity['decision'] == 'SAMPLING_INVARIANCE_CAPACITY_CONFIRMED', capacity
          assert calibration['decision'] == 'CALIBRATION_VALID', calibration
          assert calibration['settings']['angles'] == [0.04, 0.08, 0.16, 0.32], calibration
          assert v1['decision'] == 'SPECTRAL_SEARCH_NOT_PROMISING', v1
          print('v2 prerequisites passed')
          PY

  target-contract:
    needs: preflight
    if: needs.preflight.outputs.run_science == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt -r experiments/sampling-invariance-v1/requirements.txt
      - name: Validate fresh v2 target suite before search
        working-directory: experiments/sampling-invariance-search-v2
        run: |
          python targets_v2.py > target-contract.json
          python - <<'PY'
          import json
          result = json.load(open('target-contract.json'))
          assert result['valid'], result
          assert result['disjointFromV1'], result
          assert len(result['targets']) == 15, result
          print('fresh v2 target suite passed and is disjoint from v1')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sampling-invariance-search-v2-target-contract
          path: experiments/sampling-invariance-search-v2/target-contract.json
          if-no-files-found: error

  smoke:
    needs: [preflight, target-contract]
    if: needs.preflight.outputs.run_science == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt -r experiments/sampling-invariance-v1/requirements.txt
      - name: Run excluded v2 hedge-search smoke
        working-directory: experiments/sampling-invariance-search-v2
        run: |
          mkdir -p smoke-out
          python run_v2.py --population smoke --seed 95999 --output smoke-out/seed-95999.json
      - uses: actions/upload-artifact@v4
        with:
          name: sampling-invariance-search-v2-smoke
          path: experiments/sampling-invariance-search-v2/smoke-out/seed-95999.json
          if-no-files-found: error

  pilot-seed:
    needs: [preflight, smoke]
    if: needs.preflight.outputs.run_science == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        seed:
          - 96001
          - 96013
          - 96017
          - 96043
          - 96053
          - 96059
          - 96079
          - 96097
          - 96137
          - 96149
          - 96157
          - 96167
          - 96179
          - 96181
          - 96199
          - 96211
          - 96221
          - 96223
          - 96233
          - 96259
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt -r experiments/sampling-invariance-v1/requirements.txt
      - name: Run fixed consumed v2 search block
        working-directory: experiments/sampling-invariance-search-v2
        run: |
          mkdir -p pilot-out
          python run_v2.py --population pilot --seed ${{ matrix.seed }} --output pilot-out/seed-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: sampling-invariance-search-v2-${{ matrix.seed }}
          path: experiments/sampling-invariance-search-v2/pilot-out/seed-${{ matrix.seed }}.json
          if-no-files-found: error

  aggregate:
    needs: [preflight, pilot-seed]
    if: needs.preflight.outputs.run_science == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt -r experiments/sampling-invariance-v1/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: sampling-invariance-search-v2-96*
          path: experiments/sampling-invariance-search-v2/pilot-blocks
          merge-multiple: true
      - name: Reduce complete consumed v2 pilot
        working-directory: experiments/sampling-invariance-search-v2
        run: |
          python aggregate_v2.py --results-dir pilot-blocks --output search-v2-summary.json
          python - <<'PY'
          import json
          result = json.load(open('search-v2-summary.json'))
          assert result['gates']['completeHardInvariantRectangle'], result['hardInvariants']
          print('decision:', result['decision'])
          print('gates:', result['gates'])
          print('primary:', result['primary'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sampling-invariance-search-v2-summary
          path: experiments/sampling-invariance-search-v2/search-v2-summary.json
          if-no-files-found: error
