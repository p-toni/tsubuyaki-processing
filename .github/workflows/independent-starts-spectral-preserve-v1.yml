name: independent-starts-spectral-preserve-v1

on:
  pull_request:
    paths:
      - 'experiments/independent-starts-spectral-preserve-v1/**'
      - '.github/workflows/independent-starts-spectral-preserve-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      consumed: ${{ steps.guard.outputs.consumed }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard authoritative result
        id: guard
        run: |
          if test -f research-results/independent-starts-spectral-preserve-v1/results.json; then
            echo 'consumed=true' >> "$GITHUB_OUTPUT"
            echo 'authoritative result already archived; scientific jobs remain closed'
          else
            echo 'consumed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Freeze scientific source and prerequisite contract
        if: steps.guard.outputs.consumed != 'true'
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/independent-starts-spectral-preserve-v1/README.md)" = "e066537141455dcc0dbb7358d16bedf7a7b962d3"
          test "$(git hash-object experiments/independent-starts-spectral-preserve-v1/run_spectral_preserve.py)" = "4547ffb2a6af1da7898158f1d5eb17487b21bc86"
          test "$(git hash-object experiments/independent-starts-spectral-preserve-v1/aggregate.py)" = "542a9a3ecf2c8c38a535ad853c2ddef8d26ff8c6"
          test "$(git hash-object research-results/independent-starts-artistic-v1/results.json)" = "96b7657980b0b36aecffbb07cbac23f8c0a42ca6"
          test "$(git hash-object research-results/spectral-material-control-portfolio-artistic-v1/results.json)" = "311a8eb650201f43d6cf3f11c8d8671fa8c0376c"
          test "$(git hash-object research-results/operator-novelty-allocation-v1/results.json)" = "1846267c3b332ef534d09ca5738e3e188f2db173"
          test "$(git hash-object experiments/operator-novelty-allocation-v1/run_allocation.py)" = "a018790a1bb50fdfb5eedd0da71310c17d8dcd72"
          test "$(git hash-object experiments/delivery-dispersion-shortlist-v1/run_shortlist.py)" = "b3a6a9ebefb2221944404a63f7fdcfc7a65f51d5"
          test "$(git hash-object prototypes/autonomous-discovery/core.py)" = "c06b5c2d6440663becb6761981ab4cc033fe052a"
          test "$(git hash-object prototypes/autonomous-discovery/search_engine.py)" = "24492a967fcccbe01be773bf723dd9df0f501249"
          test "$(git hash-object prototypes/autonomous-discovery/material_control.py)" = "33e0462ad27f841a4369da306ecb64a15d2e0c13"
          test "$(git hash-object prototypes/autonomous-discovery/orbit_representation.py)" = "ec2aea2f0e889cea25e442dae7b5849bf8549cd1"
          test "$(git hash-object prototypes/autonomous-discovery/pairwise_selector.py)" = "0f17d6174d471bfbd2953544cc6425468212a2fc"
          test "$(git hash-object prototypes/autonomous-discovery/rng_streams.py)" = "58b2dcea6dc692c34b2ed176c42ec85af82e30c1"
          python - <<'PY'
          import json
          x=json.load(open('research-results/independent-starts-artistic-v1/results.json'))
          assert x['decision']=='INDEPENDENT_STARTS_ARTISTIC_SUPPORT_NOT_DEMONSTRATED'
          assert x['totalRestartTailVsBaselineNetPreference']==-6
          s=json.load(open('research-results/spectral-material-control-portfolio-artistic-v1/results.json'))
          assert s['decision']=='ARTISTIC_SUPPORT' and s['totalMixedVsNativeNetPreference']==12
          n=json.load(open('research-results/operator-novelty-allocation-v1/results.json'))
          assert n['noveltyWinnerCounts']=={'native':0,'spectral':60}
          PY
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.consumed != 'true'
        with:
          python-version: '3.12'
      - name: Compile frozen experiment
        if: steps.guard.outputs.consumed != 'true'
        run: python -m py_compile experiments/independent-starts-spectral-preserve-v1/*.py

  smoke:
    needs: preflight
    if: needs.preflight.outputs.consumed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run excluded exact-replay smoke
        run: |
          python experiments/independent-starts-spectral-preserve-v1/run_spectral_preserve.py \
            --seed 751999 --smoke --output smoke.json
          python - <<'PY'
          import json
          x=json.load(open('smoke.json'))
          assert x['smoke'] is True and x['masterSeed']==751999
          assert len(x['cells'])==45
          assert all(x['hardInvariants'].values())
          assert x['smokeBaselineEquivalence']=={'recurrence':True,'orbit':True,'filament':True}
          assert x['smokeR10R12SpectralReplayExact']=={'recurrence':True,'orbit':True,'filament':True}
          assert x['settings']['budgetPerArm']==20
          assert x['settings']['sharedPrefixAttempts']==10
          assert x['settings']['baselinePortfolio']=={'native':10,'spectral':10,'restart':0}
          assert x['settings']['treatmentPortfolio']=={'native':6,'spectral':10,'restart':4}
          assert x['settings']['replacedBaselineAttempts']==['R3','R4','R5','R6']
          assert x['settings']['exactlyReplayedBaselineSpectralAttempts']==['R10','R11','R12']
          PY

  seed:
    needs: smoke
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        seed: [751003,751019,751037,751053,751071,751089,751107,751127,751149,751167,751181,751199,751223,751239,751257,751277,751293,751311,751331,751349]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run frozen seed
        env:
          SEED: ${{ matrix.seed }}
        run: |
          python experiments/independent-starts-spectral-preserve-v1/run_spectral_preserve.py \
            --seed "$SEED" --output "seed-$SEED.json"
          python - <<'PY'
          import json, os
          seed=int(os.environ['SEED'])
          x=json.load(open(f'seed-{seed}.json'))
          assert x['masterSeed']==seed and x['smoke'] is False
          assert len(x['cells'])==45
          assert all(x['hardInvariants'].values())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: independent-starts-spectral-preserve-seed-${{ matrix.seed }}
          path: seed-${{ matrix.seed }}.json

  aggregate:
    needs: seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Download complete frozen seed rectangle
        uses: actions/download-artifact@v4
        with:
          pattern: independent-starts-spectral-preserve-seed-*
          path: seed-results
          merge-multiple: true
      - name: Reduce complete frozen rectangle
        run: |
          python experiments/independent-starts-spectral-preserve-v1/aggregate.py \
            --input-dir seed-results --output aggregate.json
          python - <<'PY'
          import json
          x=json.load(open('aggregate.json'))
          assert x['seedCount']==20
          assert x['routeSeedCount']==60
          assert x['cellCount']==900
          assert x['budgetPerArm']==20
          assert x['baselinePortfolio']=={'native':10,'spectral':10,'restart':0}
          assert x['treatmentPortfolio']=={'native':6,'spectral':10,'restart':4}
          assert x['meaningfulEffectMargin']==0.003255297955511336
          assert x['exactlyReplayedBaselineSpectralAttempts']==['R10','R11','R12']
          PY
      - name: Upload authoritative summary
        uses: actions/upload-artifact@v4
        with:
          name: independent-starts-spectral-preserve-v1-summary
          path: aggregate.json
