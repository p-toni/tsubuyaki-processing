name: semantic-empirical-action-memory-v1

on:
  pull_request:
    paths:
      - 'experiments/semantic-empirical-action-memory-v1/**'
      - 'research-results/semantic-empirical-action-memory-v1/results.json'
      - '.github/workflows/semantic-empirical-action-memory-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify terminal authoritative result
        run: |
          set -euo pipefail
          test -f research-results/semantic-empirical-action-memory-v1/results.json
          test "$(git hash-object research-results/semantic-empirical-action-memory-v1/results.json)" = "b16dfed1d885e4149c808c4e5c87fa23041dc849"
          python - <<'PY'
          import json
          x=json.load(open('research-results/semantic-empirical-action-memory-v1/results.json'))
          assert x['decision'] == 'EMPIRICAL_ACTION_NAVIGATION_NOT_PROMISING', x
          assert x['semanticEvidenceConsumed'] is True, x
          PY
          echo 'semantic-empirical-action-memory-v1 is terminal; authoritative evidence is archived and scientific seed regeneration is disabled.'
