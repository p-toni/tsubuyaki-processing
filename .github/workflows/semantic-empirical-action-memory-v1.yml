name: semantic-empirical-action-memory-v1

on:
  pull_request:
    paths:
      - 'experiments/semantic-empirical-action-memory-v1/**'
      - '.github/workflows/semantic-empirical-action-memory-v1.yml'
      - 'research-results/semantic-local-dynamics-v1/results.json'
      - 'experiments/semantic-local-dynamics-v1/**'
      - 'experiments/semantic-world-model-navigation-v1/**'
      - 'experiments/semantic-perceptual-steering-v1/**'
      - 'experiments/sampling-invariance-search-v1/spectral_operator.py'
      - 'prototypes/autonomous-discovery/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frozen source locks and prior-result guard
        run: |
          set -euo pipefail
          test ! -f research-results/semantic-empirical-action-memory-v1/results.json
          grep -q 'LOCAL_DYNAMICS_NOT_CALIBRATED' research-results/semantic-local-dynamics-v1/results.json
          test "$(git hash-object research-results/semantic-local-dynamics-v1/results.json)" = "8ded695acb6f8ca09a3eaee71744f21619db3440"
          test "$(git hash-object experiments/semantic-empirical-action-memory-v1/README.md)" = "7c0caed811f0d577b3e20b60bf784c5bbbfad607"
          test "$(git hash-object experiments/semantic-empirical-action-memory-v1/empirical_memory.py)" = "d6c632c3fd854b591d5d5303ce634d67d91908f6"
          test "$(git hash-object experiments/semantic-empirical-action-memory-v1/select_memory.py)" = "75b4fa5c9e917317e747c8efda3c172b367c8e95"
          test "$(git hash-object experiments/semantic-empirical-action-memory-v1/calibrate_seed.py)" = "56621cbfed634116971b46596f91fa33a2ab3941"
          test "$(git hash-object experiments/semantic-empirical-action-memory-v1/aggregate_calibration.py)" = "97d958008d40ad2509e9dc46538cc667932c03e8"
          test "$(git hash-object experiments/semantic-empirical-action-memory-v1/run_navigation.py)" = "64c7609958599aa8d0fcaa6478e6b4c8661b2b81"
          test "$(git hash-object experiments/semantic-empirical-action-memory-v1/aggregate.py)" = "f7ab4bc8081988d58ab76a8ff9689ff26455e842"
          test "$(git hash-object experiments/semantic-empirical-action-memory-v1/generate_recognition.py)" = "f1dc667beed2612f3c925e10ee45e6dbee7e51d8"
          test "$(git hash-object experiments/semantic-local-dynamics-v1/local_dynamics.py)" = "a598026cf191e742885a5a01bb5498aca99af842"
          test "$(git hash-object experiments/semantic-local-dynamics-v1/generate_pairs.py)" = "70073d40d4528221bedf4401374d7717c97e9345"
          test "$(git hash-object experiments/semantic-world-model-navigation-v1/world_model.py)" = "1c5a19157b032284edc496834ffabd5205975596"
          test "$(git hash-object experiments/semantic-world-model-navigation-v1/unseen_targets.py)" = "bdf5e73cb95f8ee66a72b8f681d6a1f242a2d289"
          test "$(git hash-object experiments/semantic-perceptual-steering-v1/perceptual_metric.py)" = "46f707729cf4b9b0e027a220a17ec956a4c6c4ec"
          test "$(git hash-object experiments/sampling-invariance-search-v1/spectral_operator.py)" = "c86f3a5b9d2862afba4232956066faeda9f378f0"
          test "$(git hash-object prototypes/autonomous-discovery/core.py)" = "c06b5c2d6440663becb6761981ab4cc033fe052a"
          test "$(git hash-object prototypes/autonomous-discovery/material_control.py)" = "33e0462ad27f841a4369da306ecb64a15d2e0c13"
          test "$(git hash-object prototypes/autonomous-discovery/orbit_representation.py)" = "ec2aea2f0e889cea25e442dae7b5849bf8549cd1"
          test "$(git hash-object prototypes/autonomous-discovery/representations.py)" = "1838d8afd05a55ae4acf49ac37a9a670858af913"
          test "$(git hash-object prototypes/autonomous-discovery/rng_streams.py)" = "58b2dcea6dc692c34b2ed176c42ec85af82e30c1"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile experiments/semantic-empirical-action-memory-v1/*.py

  targets:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Validate still-unconsumed semantic suite
        run: |
          python experiments/semantic-world-model-navigation-v1/unseen_targets.py > target-contract.json
          python - <<'PY'
          import json
          x=json.load(open('target-contract.json'))
          assert x['valid'], x['failures']
          assert x['distinctFingerprints'] and x['disjointFromPriorTargets']
          assert tuple(x['prompts']) == ('arrow','key','mushroom','cloud','number-3','hourglass','bird','cactus')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: empirical-memory-target-contract
          path: target-contract.json

  select-memory:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Download exact immutable target-blind experience from local-dynamics v1
        uses: actions/download-artifact@v4
        with:
          pattern: local-dynamics-train-*
          path: training
          merge-multiple: true
          run-id: 33336810605
          github-token: ${{ github.token }}
          repository: p-toni/tsubuyaki-processing
      - name: Select retrieval config using target-free leave-one-seed-out CV
        run: |
          set -euo pipefail
          test "$(find training -name 'train-*.npz' | wc -l)" -eq 12
          python experiments/semantic-empirical-action-memory-v1/select_memory.py \
            --input-dir training --memory-output memory.npz --summary-output memory-selection.json
          python - <<'PY'
          import json, numpy as np
          x=json.load(open('memory-selection.json'))
          assert x['trainingContainsSemanticTargets'] is False
          assert x['selectionUsesOnlyPriorTargetBlindTrainingArtifacts'] is True
          assert x['priorTrainingRunId'] == 33336810605
          assert x['priorTrainingHeadSha'] == 'a22ad8d607b8f879949fec3f3c8f537079629ed6'
          assert len(x['trainingSeeds']) == 12 and x['candidateConfigCount'] == 80
          assert x['selected']['k'] in [4,8,16,32,64]
          assert x['selected']['actionWeight'] in [0.0,0.25,1.0,4.0]
          assert x['selected']['shrinkage'] in [0.25,0.5,0.75,1.0]
          with np.load('memory.npz', allow_pickle=False) as d:
              assert len(d['parent_visual']) == 13824
              assert int(d['prior_train_run_id'][0]) == 33336810605
              assert str(d['prior_train_head_sha'][0]) == 'a22ad8d607b8f879949fec3f3c8f537079629ed6'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-empirical-action-memory-v1
          path: |
            memory.npz
            memory-selection.json

  calibrate-seed:
    needs: select-memory
    strategy:
      fail-fast: true
      max-parallel: 6
      matrix:
        seed: [735200011, 735200029, 735200041, 735200067, 735200079, 735200101]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: semantic-empirical-action-memory-v1
          path: memory
      - name: Run fresh target-free empirical-memory calibration shard
        run: |
          python experiments/semantic-empirical-action-memory-v1/calibrate_seed.py \
            --seed ${{ matrix.seed }} --memory memory/memory.npz --output calibration-${{ matrix.seed }}.json
          python - <<'PY'
          import glob,json
          x=json.load(open(glob.glob('calibration-*.json')[0]))
          assert x['calibrationContainsSemanticTargets'] is False
          assert x['pairStats']['rowCount'] == 384
          assert len(x['retrievalTasks']) == 96
          assert all(x['hardInvariants'].values()), x['hardInvariants']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: empirical-memory-calibration-${{ matrix.seed }}
          path: calibration-${{ matrix.seed }}.json

  calibration-gate:
    needs: calibrate-seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: empirical-memory-calibration-*
          path: calibration
          merge-multiple: true
      - name: Reduce target-free calibration only
        run: |
          python experiments/semantic-empirical-action-memory-v1/aggregate_calibration.py \
            --input-dir calibration --output calibration-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-empirical-action-memory-calibration-summary
          path: calibration-summary.json
      - name: Enforce frozen target-free calibration gate
        run: |
          python - <<'PY'
          import json
          x=json.load(open('calibration-summary.json'))
          assert x['decision'] == 'EMPIRICAL_ACTION_MEMORY_CALIBRATED', x
          assert all(x['gates'].values()), x['gates']
          assert x['semanticEvidenceConsumed'] is False
          PY

  smoke:
    needs: [calibration-gate, targets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: semantic-empirical-action-memory-v1
          path: memory
      - name: Run excluded exact-budget three-arm smoke
        run: |
          python experiments/semantic-empirical-action-memory-v1/run_navigation.py \
            --seed 735399999 --memory memory/memory.npz --output smoke.json --smoke
          python - <<'PY'
          import json
          x=json.load(open('smoke.json'))
          assert x['smoke'] is True
          assert x['renderBudgetPerArmConcept'] == 60
          assert len(x['prompts']) == 8
          assert all(x['hardInvariants'].values()), x['hardInvariants']
          for c in x['concepts'].values():
              assert c['breadth60']['logicalRenderedCount'] == 60
              assert c['meanDynamics60']['logicalRenderedCount'] == 60
              assert c['empiricalMemory60']['logicalRenderedCount'] == 60
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-empirical-action-memory-smoke
          path: smoke.json

  consumed:
    needs: smoke
    strategy:
      fail-fast: true
      max-parallel: 6
      matrix:
        seed: [735300011, 735300029, 735300041, 735300067, 735300079, 735300101, 735300113, 735300137, 735300151, 735300173, 735300197, 735300211]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: semantic-empirical-action-memory-v1
          path: memory
      - name: Run fresh zero-shot three-arm semantic seed
        run: |
          python experiments/semantic-empirical-action-memory-v1/run_navigation.py \
            --seed ${{ matrix.seed }} --memory memory/memory.npz --output semantic-${{ matrix.seed }}.json
          python - <<'PY'
          import glob,json
          x=json.load(open(glob.glob('semantic-*.json')[0]))
          assert not x['smoke']
          assert x['renderBudgetPerArmConcept'] == 60
          assert all(x['hardInvariants'].values()), x['hardInvariants']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-empirical-action-memory-${{ matrix.seed }}
          path: semantic-${{ matrix.seed }}.json

  aggregate:
    needs: consumed
    runs-on: ubuntu-latest
    outputs:
      recognition-authorized: ${{ steps.verdict.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: semantic-empirical-action-memory-7353*
          path: evidence
          merge-multiple: true
      - name: Reduce only complete fresh semantic rectangle
        run: |
          python experiments/semantic-empirical-action-memory-v1/aggregate.py \
            --input-dir evidence --output semantic-empirical-action-memory-summary.json
          python - <<'PY'
          import json
          x=json.load(open('semantic-empirical-action-memory-summary.json'))
          assert x['cellCount'] == 96 and x['seedCount'] == 12 and x['conceptCount'] == 8
          assert x['decision'] in {
              'EMPIRICAL_ACTION_MEMORY_SEMANTIC_NAVIGATION_PROMISING',
              'ROUTE_ACTION_MEAN_SEMANTIC_NAVIGATION_PROMISING',
              'EMPIRICAL_ACTION_NAVIGATION_NOT_PROMISING',
          }
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-empirical-action-memory-summary
          path: semantic-empirical-action-memory-summary.json
      - name: Publish recognition authorization only after aggregate
        id: verdict
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open('semantic-empirical-action-memory-summary.json'))
          print('authorized=' + ('true' if x.get('winningArmForRecognition') else 'false'))
          PY

  recognition-package:
    needs: aggregate
    if: needs.aggregate.outputs.recognition-authorized == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: semantic-empirical-action-memory-7353*
          path: evidence
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: semantic-empirical-action-memory-summary
          path: summary
      - name: Generate frozen blinded recognition package
        run: |
          python experiments/semantic-empirical-action-memory-v1/generate_recognition.py \
            --summary summary/semantic-empirical-action-memory-summary.json \
            --evidence-dir evidence --output-root recognition
          test -f recognition/review/recognition-sheet.png
          test -f recognition/sealed-key/recognition-key.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-empirical-action-memory-recognition-review
          path: recognition/review
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-empirical-action-memory-recognition-sealed-key
          path: recognition/sealed-key
