name: triad-pair-matrix-experiment

on:
  pull_request:
    paths:
      - "experiments/triad-pair-matrix-v1/**"
      - ".github/workflows/triad-pair-matrix-experiment.yml"

permissions:
  contents: read

jobs:
  calibrate:
    strategy:
      fail-fast: false
      matrix:
        seed: [7, 19, 43]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Verify explicit pair-matrix semantics
        run: python experiments/triad-pair-matrix-v1/test_pair_matrix.py
      - name: Run pair-matrix triad calibration
        run: |
          python - <<'PY' \
            | tee /tmp/triad-pair-matrix-${{ matrix.seed }}.json
          import importlib.util, json, pathlib, sys
          path=pathlib.Path('experiments/triad-pair-matrix-v1/reproduce.py')
          spec=importlib.util.spec_from_file_location('matrix_exp',path)
          mod=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=mod
          spec.loader.exec_module(mod)
          print(json.dumps(mod.run_seed(${{ matrix.seed }}),indent=2))
          PY
      - name: Upload seed result
        uses: actions/upload-artifact@v4
        with:
          name: triad-pair-matrix-seed-${{ matrix.seed }}
          path: /tmp/triad-pair-matrix-${{ matrix.seed }}.json
