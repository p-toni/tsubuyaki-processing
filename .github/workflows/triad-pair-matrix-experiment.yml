name: triad-pair-matrix-experiment

on:
  pull_request:
    paths:
      - "experiments/triad-pair-matrix-v1/**"
      - ".github/workflows/triad-pair-matrix-experiment.yml"

permissions:
  contents: read

jobs:
  calibrate:
    strategy:
      fail-fast: false
      matrix:
        seed: [7, 19, 43]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Verify explicit pair-matrix semantics
        run: python experiments/triad-pair-matrix-v1/test_pair_matrix.py
      - name: Run pair-matrix triad calibration
        run: |
          python experiments/triad-pair-matrix-v1/run_seed.py \
            --seed ${{ matrix.seed }} \
            | tee /tmp/triad-pair-matrix-${{ matrix.seed }}.json
      - name: Upload seed result
        uses: actions/upload-artifact@v4
        with:
          name: triad-pair-matrix-seed-${{ matrix.seed }}
          path: /tmp/triad-pair-matrix-${{ matrix.seed }}.json
