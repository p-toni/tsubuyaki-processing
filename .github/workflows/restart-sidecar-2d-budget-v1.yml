name: restart-sidecar-2d-budget-v1

on:
  pull_request:
    paths:
      - 'experiments/restart-sidecar-2d-budget-v1/**'
      - '.github/workflows/restart-sidecar-2d-budget-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PRE_EXPERIMENT_BASE: 144db8a9b361b3c8421ddd0736ed6690f6929813

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      consumed: ${{ steps.guard.outputs.consumed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard authoritative result
        id: guard
        run: |
          if test -f research-results/restart-sidecar-2d-budget-v1/results.json; then
            echo 'consumed=true' >> "$GITHUB_OUTPUT"
            echo 'authoritative result already archived; regeneration remains closed'
          else
            echo 'consumed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Freeze protocol and fresh namespace
        if: steps.guard.outputs.consumed != 'true'
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/restart-sidecar-2d-budget-v1/README.md)" = "7a3ed75dda8b6ea93120c96226bdf514cfb8a493"
          test "$(git hash-object experiments/restart-sidecar-2d-budget-v1/run.py)" = "745f5b14a45b7031db64468ce6256f56ec997e57"
          test "$(git hash-object experiments/restart-sidecar-2d-budget-v1/aggregate.py)" = "26ec2e30da487d53a6786fb66ac30f1e4f8ecf14"
          test "$(git merge-base "$PRE_EXPERIMENT_BASE" HEAD)" = "$PRE_EXPERIMENT_BASE"
          actual="$(git diff --name-only "$PRE_EXPERIMENT_BASE"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/restart-sidecar-2d-budget-v1.yml' \
            'experiments/restart-sidecar-2d-budget-v1/README.md' \
            'experiments/restart-sidecar-2d-budget-v1/aggregate.py' \
            'experiments/restart-sidecar-2d-budget-v1/run.py' | sort)"
          test "$actual" = "$expected"
          seeds='761999 761003 761019 761037 761053 761071 761089 761107 761127 761149 761167 761181 761199 761223 761239 761257 761277 761293 761311 761331 761349'
          for s in $seeds; do
            if git grep -n -E "(^|[^0-9])${s}([^0-9]|$)" "$PRE_EXPERIMENT_BASE" -- .; then
              echo "seed ${s} already existed at frozen pre-experiment base" >&2
              exit 1
            fi
            if git log "$PRE_EXPERIMENT_BASE" --format='%B' | grep -E "(^|[^0-9])${s}([^0-9]|$)"; then
              echo "seed ${s} found in pre-experiment commit messages" >&2
              exit 1
            fi
          done
          python -m py_compile experiments/restart-sidecar-2d-budget-v1/*.py

  smoke:
    needs: preflight
    if: needs.preflight.outputs.consumed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run excluded smoke
        run: |
          python experiments/restart-sidecar-2d-budget-v1/run.py \
            --seed 761999 --smoke --output smoke.json
          python - <<'PY'
          import json
          x=json.load(open('smoke.json'))
          assert x['smoke'] is True and x['masterSeed'] == 761999
          assert x['settings']['routes'] == ['family','sheet']
          assert x['settings']['budgetsPerRoute'] == [1,2,4,8]
          assert x['settings']['baselineNativePerRoute'] == 20
          assert x['settings']['baselineSpectralPerRoute'] == 0
          assert all(x['hardInvariants'].values())
          assert x['hardInvariants']['productionApiFirstFourReplayExact']
          assert len(x['cells']) == 120
          PY

  seed:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        seed: [761003,761019,761037,761053,761071,761089,761107,761127,761149,761167,761181,761199,761223,761239,761257,761277,761293,761311,761331,761349]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run frozen seed
        env:
          SEED: ${{ matrix.seed }}
        run: |
          python experiments/restart-sidecar-2d-budget-v1/run.py \
            --seed "$SEED" --output "seed-$SEED.json"
          python - <<'PY'
          import json, os
          seed=int(os.environ['SEED'])
          x=json.load(open(f'seed-{seed}.json'))
          assert x['masterSeed']==seed and x['smoke'] is False
          assert all(x['hardInvariants'].values())
          assert len(x['cells']) == 120
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: restart-sidecar-2d-budget-seed-${{ matrix.seed }}
          path: seed-${{ matrix.seed }}.json

  aggregate:
    needs: seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: restart-sidecar-2d-budget-seed-*
          path: seed-results
          merge-multiple: true
      - name: Reduce complete frozen rectangle
        run: |
          python experiments/restart-sidecar-2d-budget-v1/aggregate.py \
            --input-dir seed-results --output results.json
          python - <<'PY'
          import json
          x=json.load(open('results.json'))
          assert x['seedCount']==20
          assert x['routeSeedCount']==40
          assert x['budgetsPerRoute']==[1,2,4,8]
          assert x['decision'] in {
            'SIDECAR_2D_BUDGET_EFFECT_NOT_REPLICATED',
            'SIDECAR_2D_SMALLER_BUDGET_SUFFICIENT',
            'SIDECAR_2D_FOUR_MECHANICALLY_EFFICIENT',
            'SIDECAR_2D_EIGHT_REQUIRED_FOR_COVERAGE',
          }
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: restart-sidecar-2d-budget-v1-summary
          path: results.json