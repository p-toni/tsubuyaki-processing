name: mutation-scale-schedule-holdout

on:
  pull_request:
    paths:
      - "experiments/mutation-scale-schedule-v1/**"
      - ".github/workflows/mutation-scale-schedule-holdout.yml"

concurrency:
  group: mutation-scale-schedule-holdout-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        route: [recurrence, orbit, family, sheet, filament]
        seed: [193, 197, 199]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run frozen schedule holdout block
        shell: bash
        run: |
          set -o pipefail
          python experiments/mutation-scale-schedule-v1/policy.py \
            --route "${{ matrix.route }}" \
            --seed "${{ matrix.seed }}" \
            --contrasts "1.0,1.25" \
            | tee "/tmp/mutation-scale-schedule-holdout-${{ matrix.route }}-${{ matrix.seed }}.json"
      - name: Upload holdout block
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-scale-schedule-holdout-${{ matrix.route }}-${{ matrix.seed }}
          path: /tmp/mutation-scale-schedule-holdout-${{ matrix.route }}-${{ matrix.seed }}.json
          if-no-files-found: warn

  aggregate-holdout:
    needs: block
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-scale-schedule-holdout-*
          path: /tmp/mutation-scale-schedule-holdout-results
          merge-multiple: true
      - name: Apply frozen holdout rule and retain paired continuous effects
        shell: bash
        run: |
          set -o pipefail
          python experiments/mutation-scale-schedule-v1/aggregate_holdout.py \
            --results-dir /tmp/mutation-scale-schedule-holdout-results \
            | tee /tmp/mutation-scale-schedule-holdout-summary.json
      - name: Upload holdout summary
        uses: actions/upload-artifact@v4
        with:
          name: mutation-scale-schedule-holdout-summary
          path: /tmp/mutation-scale-schedule-holdout-summary.json
