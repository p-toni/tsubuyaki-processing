name: search-measurement-audit

on:
  pull_request:
    paths:
      - "experiments/search-measurement-audit-v1/**"
      - ".github/workflows/search-measurement-audit.yml"

concurrency:
  group: search-measurement-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  objective-block:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        route: [recurrence, orbit, family, sheet, filament]
        seed: [101, 103, 107]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run objective audit block
        shell: bash
        run: |
          set -o pipefail
          python experiments/search-measurement-audit-v1/objective_audit.py \
            --route "${{ matrix.route }}" \
            --seed "${{ matrix.seed }}" \
            | tee "/tmp/search-measurement-${{ matrix.route }}-${{ matrix.seed }}.json"
      - name: Upload objective block
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-measurement-${{ matrix.route }}-${{ matrix.seed }}
          path: /tmp/search-measurement-${{ matrix.route }}-${{ matrix.seed }}.json
          if-no-files-found: warn

  aggregate:
    needs: objective-block
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: search-measurement-*
          path: /tmp/search-measurement-results
          merge-multiple: true
      - name: Aggregate objective audit
        shell: bash
        run: |
          set -o pipefail
          python experiments/search-measurement-audit-v1/aggregate.py \
            --results-dir /tmp/search-measurement-results \
            | tee /tmp/search-measurement-summary.json
      - name: Run exact route-vote gate audit
        shell: bash
        run: |
          set -o pipefail
          python experiments/search-measurement-audit-v1/gate_audit.py \
            | tee /tmp/search-gate-audit.json
      - name: Upload audit summaries
        uses: actions/upload-artifact@v4
        with:
          name: search-measurement-audit-summary
          path: |
            /tmp/search-measurement-summary.json
            /tmp/search-gate-audit.json
