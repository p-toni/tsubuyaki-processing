name: sampling-invariance-search-top1-confirmation-v1

on:
  pull_request:
    paths:
      - 'experiments/sampling-invariance-search-top1-confirmation-v1/**'
      - 'research-results/sampling-invariance-search-top1-confirmation-v1/**'
      - '.github/workflows/sampling-invariance-search-top1-confirmation-v1.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      run_science: ${{ steps.guard.outputs.run_science }}
    steps:
      - uses: actions/checkout@v4
      - id: guard
        shell: bash
        run: |
          if [[ -f research-results/sampling-invariance-search-top1-confirmation-v1/results.json ]]; then
            echo 'run_science=false' >> "$GITHUB_OUTPUT"
            echo 'Persisted top-one confirmation exists; skip expensive rerun.'
          else
            echo 'run_science=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify hypothesis lineage and frozen scientific blobs
        shell: bash
        run: |
          test "$(git hash-object experiments/sampling-invariance-v1/field.py)" = 66f59d92ab39379d3a2016d18adbd271827997dd
          test "$(git hash-object experiments/sampling-invariance-v1/capacity.py)" = fa5aa481ddab9babff17abdf1e4342d7ed74d2a2
          test "$(git hash-object experiments/sampling-invariance-v1/fast_binary_metric.py)" = 7e1c875350050312971d9397091e8708752c0bcd
          test "$(git hash-object experiments/sampling-invariance-search-v1/spectral_operator.py)" = c86f3a5b9d2862afba4232956066faeda9f378f0
          test "$(git hash-object experiments/sampling-invariance-search-v2/run_search_v2.py)" = 1e2f0dc4c03971287fe87da184e3c01674f84284
          test "$(git hash-object experiments/sampling-invariance-search-top1-confirmation-v1/targets_top1.py)" = 6f13cdf3bf6de6d7654495668e16a095872295c7
          test "$(git hash-object experiments/sampling-invariance-search-top1-confirmation-v1/run_top1.py)" = 63d2976c4f4c4e54ae66d001be183690eac26dd4
          test "$(git hash-object experiments/sampling-invariance-search-top1-confirmation-v1/aggregate_top1.py)" = 50d50109f70f2fe447bcedb280bb46e2bcdf6234
          python - <<'PY'
          import json
          v2 = json.load(open('research-results/sampling-invariance-search-v2/results.json'))
          assert v2['decision'] == 'SPECTRAL_HEDGE_SEARCH_NOT_PROMISING', v2
          assert v2['interpretation']['hedgeMechanismSupported'] is False, v2
          assert v2['primary']['top1VsBreadth']['mean'] > 0, v2
          print('fresh top-one hypothesis lineage passed')
          PY

  target-contract:
    needs: preflight
    if: needs.preflight.outputs.run_science == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt -r experiments/sampling-invariance-v1/requirements.txt
      - name: Validate fresh target suite against v1 and v2
        working-directory: experiments/sampling-invariance-search-top1-confirmation-v1
        run: |
          python targets_top1.py > target-contract.json
          python - <<'PY'
          import json
          result = json.load(open('target-contract.json'))
          assert result['valid'], result
          assert result['disjointFromV1V2'], result
          assert len(result['targets']) == 15, result
          print('fresh top-one target suite passed and is disjoint from v1/v2')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sampling-invariance-search-top1-target-contract
          path: experiments/sampling-invariance-search-top1-confirmation-v1/target-contract.json
          if-no-files-found: error

  smoke:
    needs: [preflight, target-contract]
    if: needs.preflight.outputs.run_science == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt -r experiments/sampling-invariance-v1/requirements.txt
      - name: Run excluded top-one confirmation smoke
        working-directory: experiments/sampling-invariance-search-top1-confirmation-v1
        run: |
          mkdir -p smoke-out
          python run_top1.py --population smoke --seed 96999 --output smoke-out/seed-96999.json
      - uses: actions/upload-artifact@v4
        with:
          name: sampling-invariance-search-top1-smoke
          path: experiments/sampling-invariance-search-top1-confirmation-v1/smoke-out/seed-96999.json
          if-no-files-found: error

  confirmation-seed:
    needs: [preflight, smoke]
    if: needs.preflight.outputs.run_science == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        seed:
          - 97001
          - 97003
          - 97007
          - 97021
          - 97039
          - 97073
          - 97081
          - 97103
          - 97117
          - 97127
          - 97151
          - 97157
          - 97159
          - 97169
          - 97171
          - 97177
          - 97187
          - 97213
          - 97231
          - 97241
          - 97259
          - 97283
          - 97301
          - 97303
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt -r experiments/sampling-invariance-v1/requirements.txt
      - name: Run fixed fresh top-one confirmation block
        working-directory: experiments/sampling-invariance-search-top1-confirmation-v1
        run: |
          mkdir -p confirmation-out
          python run_top1.py --population confirmation --seed ${{ matrix.seed }} --output confirmation-out/seed-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: sampling-invariance-search-top1-${{ matrix.seed }}
          path: experiments/sampling-invariance-search-top1-confirmation-v1/confirmation-out/seed-${{ matrix.seed }}.json
          if-no-files-found: error

  aggregate:
    needs: [preflight, confirmation-seed]
    if: needs.preflight.outputs.run_science == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt -r experiments/sampling-invariance-v1/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: sampling-invariance-search-top1-97*
          path: experiments/sampling-invariance-search-top1-confirmation-v1/confirmation-blocks
          merge-multiple: true
      - name: Reduce complete fresh top-one confirmation
        working-directory: experiments/sampling-invariance-search-top1-confirmation-v1
        run: |
          python aggregate_top1.py --results-dir confirmation-blocks --output top1-confirmation-summary.json
          python - <<'PY'
          import json
          result = json.load(open('top1-confirmation-summary.json'))
          assert result['gates']['completeHardInvariantRectangle'], result['hardInvariants']
          print('decision:', result['decision'])
          print('gates:', result['gates'])
          print('primary:', result['primary'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sampling-invariance-search-top1-confirmation-summary
          path: experiments/sampling-invariance-search-top1-confirmation-v1/top1-confirmation-summary.json
          if-no-files-found: error
