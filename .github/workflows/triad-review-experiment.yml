name: triad-review-experiment

on:
  pull_request:
    paths:
      - "experiments/triad-review-v1/**"
      - ".github/workflows/triad-review-experiment.yml"

permissions:
  contents: read

jobs:
  calibrate:
    strategy:
      fail-fast: false
      matrix:
        seed: [7, 19, 43]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Verify triad evidence algebra
        run: python experiments/triad-review-v1/test_triad_algebra.py
      - name: Run dependency-safe triad calibration
        run: |
          python experiments/triad-review-v1/run_seed.py \
            --seed ${{ matrix.seed }} \
            | tee /tmp/triad-review-${{ matrix.seed }}.json
      - name: Upload seed result
        uses: actions/upload-artifact@v4
        with:
          name: triad-review-seed-${{ matrix.seed }}
          path: /tmp/triad-review-${{ matrix.seed }}.json
