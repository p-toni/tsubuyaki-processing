name: route-conditional-policy-experiment

on:
  pull_request:
    paths:
      - "experiments/route-conditional-policy-v1/**"
      - ".github/workflows/route-conditional-policy-experiment.yml"

concurrency:
  group: route-conditional-policy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        route: [recurrence, orbit, family, sheet, filament]
        seed: [109, 113, 127]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run fresh-seed route-policy block
        shell: bash
        run: |
          set -o pipefail
          python experiments/route-conditional-policy-v1/reproduce.py \
            --route "${{ matrix.route }}" \
            --seed "${{ matrix.seed }}" \
            | tee "/tmp/route-policy-${{ matrix.route }}-${{ matrix.seed }}.json"
      - name: Upload block result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-policy-${{ matrix.route }}-${{ matrix.seed }}
          path: /tmp/route-policy-${{ matrix.route }}-${{ matrix.seed }}.json
          if-no-files-found: warn

  aggregate:
    needs: block
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: route-policy-*
          path: /tmp/route-policy-results
          merge-multiple: true
      - name: Aggregate preregistered holdout rules
        shell: bash
        run: |
          set -o pipefail
          python experiments/route-conditional-policy-v1/aggregate.py \
            --results-dir /tmp/route-policy-results \
            | tee /tmp/route-policy-summary.json
      - name: Upload aggregate result
        uses: actions/upload-artifact@v4
        with:
          name: route-policy-summary
          path: /tmp/route-policy-summary.json
