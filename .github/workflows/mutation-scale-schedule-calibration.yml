name: mutation-scale-schedule-calibration

on:
  pull_request:
    paths:
      - "experiments/mutation-scale-schedule-v1/**"
      - ".github/workflows/mutation-scale-schedule-calibration.yml"

concurrency:
  group: mutation-scale-schedule-calibration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        route: [recurrence, orbit, family, sheet, filament]
        seed: [101, 103, 107, 109, 113, 127, 131, 137, 139, 149, 151, 157, 163, 167, 173, 179, 181, 191]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - name: Run scale-schedule calibration block
        shell: bash
        run: |
          set -o pipefail
          python experiments/mutation-scale-schedule-v1/policy.py \
            --route "${{ matrix.route }}" \
            --seed "${{ matrix.seed }}" \
            | tee "/tmp/mutation-scale-schedule-${{ matrix.route }}-${{ matrix.seed }}.json"
      - name: Upload calibration block
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-scale-schedule-${{ matrix.route }}-${{ matrix.seed }}
          path: /tmp/mutation-scale-schedule-${{ matrix.route }}-${{ matrix.seed }}.json
          if-no-files-found: warn

  aggregate-calibration:
    needs: block
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install -r prototypes/autonomous-discovery/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-scale-schedule-*
          path: /tmp/mutation-scale-schedule-results
          merge-multiple: true
      - name: Apply frozen scale-schedule calibration rule
        shell: bash
        run: |
          set -o pipefail
          python experiments/mutation-scale-schedule-v1/aggregate_calibration.py \
            --results-dir /tmp/mutation-scale-schedule-results \
            | tee /tmp/mutation-scale-schedule-calibration-summary.json
      - name: Upload calibration summary
        uses: actions/upload-artifact@v4
        with:
          name: mutation-scale-schedule-calibration-summary
          path: /tmp/mutation-scale-schedule-calibration-summary.json
