name: compact-iterative-filament-v1

on:
  pull_request:
    paths:
      - 'experiments/compact-iterative-filament-v1/**'
      - '.github/workflows/compact-iterative-filament-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE: e636ce85b05b876e37779ad19d22249a8a3c9a01

jobs:
  custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify consumed-population custody
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git hash-object experiments/compact-iterative-filament-v1/README.md)" = "5fea6fec53c4237064c71b6fb855cee4d4d920dc"
          test "$(git hash-object experiments/compact-iterative-filament-v1/run.py)" = "1aacb6ea2db0bfe7cc1b6f0f29511e2198b76559"
          test "$(git hash-object experiments/complete-workflow-audit-v2/render_exact_post.mjs)" = "4a6a2c18259dd316911aefc92d928347f2a26826"
          test "$(git hash-object scripts/check-length.mjs)" = "319681179e53cbb761135313332cfc83ea5b3f48"
          test -f experiments/compact-iterative-filament-v1/authoritative-artifacts.json
          python - <<'PY'
          import json
          p='experiments/compact-iterative-filament-v1/authoritative-artifacts.json'
          x=json.load(open(p))
          assert x['runId']==34135192654
          assert x['generationHead']=='795d04c55f1f8bee676883976318a358a5527e3f'
          assert x['reviewer']=={'artifactId':10024611551,'digest':'sha256:99c8fefd41065c266843dac7ecd8b535faf83bdbd85152ec7618b784886826fd'}
          assert x['sealedArchive']=={'artifactId':10024613114,'digest':'sha256:14c8ed298eb482c6c5271307fafeca39b427bb934bce82b491683cfd81df48b7'}
          assert x['mechanical']=={'artifactId':10024613621,'digest':'sha256:f6bbebecd2c5356dd8263aa36f033236a83b6efbc4d4fbfee33fd240e8698009'}
          PY
          echo 'Consumed 772xxx generation is disabled; custody-only workflow.'
