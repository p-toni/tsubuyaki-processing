name: compact-iterative-filament-v1

on:
  pull_request:
    paths:
      - 'experiments/compact-iterative-filament-v1/**'
      - '.github/workflows/compact-iterative-filament-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE: e636ce85b05b876e37779ad19d22249a8a3c9a01

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze sources and verify fresh population
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git hash-object experiments/compact-iterative-filament-v1/README.md)" = "5fea6fec53c4237064c71b6fb855cee4d4d920dc"
          test "$(git hash-object experiments/compact-iterative-filament-v1/run.py)" = "1aacb6ea2db0bfe7cc1b6f0f29511e2198b76559"
          test "$(git hash-object experiments/complete-workflow-audit-v2/render_exact_post.mjs)" = "4a6a2c18259dd316911aefc92d928347f2a26826"
          test "$(git hash-object scripts/check-length.mjs)" = "319681179e53cbb761135313332cfc83ea5b3f48"
          if git grep -n -E '772003|772019|772037|772053|772071|772089|772107|772127|772149|772167|772181|772199|772999' "$BASE" -- . >/tmp/base-772.txt; then
            echo 'reserved 772xxx population already appears in frozen base:' >&2
            cat /tmp/base-772.txt >&2
            exit 1
          fi
          python -m py_compile experiments/compact-iterative-filament-v1/run.py
      - name: Install image dependency
        run: python -m pip install Pillow
      - name: Run excluded smoke
        run: python experiments/compact-iterative-filament-v1/run.py --smoke --out smoke | tee smoke.log
      - name: Assert smoke contract
        run: |
          python - <<'PY'
          import json
          x=json.load(open('smoke/mechanical.json'))
          assert x['status']=='excluded-smoke'
          assert len(x['pairs'])==1
          p=x['pairs'][0]
          assert p['masterSeed']==772999
          assert p['uniqueCandidateCount']==24
          assert p['nativeSlots']==12 and p['iterativeSlots']==12
          assert p['matchedOuterPairs']==12
          assert p['allLengthsPass'] and p['allGeometryHardPass']
          assert all(x['hardInvariants'].values())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: compact-iterative-filament-v1-smoke
          path: |
            smoke/reviewer/
            smoke/mechanical.json
            smoke.log

  authoritative:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck frozen implementation
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/compact-iterative-filament-v1/README.md)" = "5fea6fec53c4237064c71b6fb855cee4d4d920dc"
          test "$(git hash-object experiments/compact-iterative-filament-v1/run.py)" = "1aacb6ea2db0bfe7cc1b6f0f29511e2198b76559"
          test "$(git hash-object experiments/complete-workflow-audit-v2/render_exact_post.mjs)" = "4a6a2c18259dd316911aefc92d928347f2a26826"
          test "$(git hash-object scripts/check-length.mjs)" = "319681179e53cbb761135313332cfc83ea5b3f48"
          python -m py_compile experiments/compact-iterative-filament-v1/run.py
      - name: Install image dependency
        run: python -m pip install Pillow
      - name: Generate authoritative blinded portfolios
        run: python experiments/compact-iterative-filament-v1/run.py --out authoritative | tee authoritative.log
      - name: Assert authoritative rectangle
        run: |
          python - <<'PY'
          import json
          x=json.load(open('authoritative/mechanical.json'))
          expected=[772003,772019,772037,772053,772071,772089,772107,772127,772149,772167,772181,772199]
          assert x['status']=='authoritative' and len(x['pairs'])==12
          assert [p['masterSeed'] for p in x['pairs']]==expected
          assert all(p['uniqueCandidateCount']==24 for p in x['pairs'])
          assert all(p['nativeSlots']==12 and p['iterativeSlots']==12 for p in x['pairs'])
          assert all(p['matchedOuterPairs']==12 for p in x['pairs'])
          assert all(p['allLengthsPass'] and p['allGeometryHardPass'] for p in x['pairs'])
          assert all(x['hardInvariants'].values())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: compact-iterative-filament-v1-reviewer
          path: authoritative/reviewer/
      - uses: actions/upload-artifact@v4
        with:
          name: compact-iterative-filament-v1-sealed-archive
          path: authoritative/sealed-archive/
      - uses: actions/upload-artifact@v4
        with:
          name: compact-iterative-filament-v1-mechanical
          path: |
            authoritative/mechanical.json
            authoritative.log
